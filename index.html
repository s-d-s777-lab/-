<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0a84ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Судноводій"><meta name="format-detection" content="telephone=no"><title>Тести судноводія</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e5e7eb;--accent:#0a84ff;--accent2:#0057d9;--green:#169b62;--greenbg:#e9f8f0;--red:#d92d20;--redbg:#fff0ef;--amber:#b7791f;--amberbg:#fff8e6;--shadow:0 8px 28px rgba(20,32,60,.08);--radius:20px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#191c22;--text:#f5f7fa;--muted:#a3aab8;--border:#2a2f39;--accent:#409cff;--accent2:#7ab8ff;--green:#42d392;--greenbg:#123326;--red:#ff6b63;--redbg:#3a1919;--amber:#ffd166;--amberbg:#3b3118;--shadow:none}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}.app{max-width:820px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 10px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);z-index:10}.brand{font-size:22px;font-weight:800;letter-spacing:-.03em}.pill{font-size:13px;padding:7px 10px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin:10px 0}.hero{padding:22px}.hero h1{font-size:30px;line-height:1.08;margin:4px 0 9px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);line-height:1.5}.progress-track{height:10px;border-radius:999px;background:var(--border);overflow:hidden;margin:14px 0 8px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .3s}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:13px}.big-number{font-size:34px;font-weight:800;letter-spacing:-.04em}.btn{appearance:none;border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:white;width:100%;touch-action:manipulation}.btn.secondary{background:var(--card);color:var(--accent);border:1px solid var(--border)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn.danger{background:var(--red);color:white}.btn:disabled{opacity:.45}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section-title{font-size:20px;font-weight:800;margin:22px 2px 10px}.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;margin-bottom:10px}.question{font-size:21px;font-weight:750;line-height:1.35;letter-spacing:-.02em;margin:8px 0 18px}.answers{display:grid;gap:10px}.answer{display:flex;align-items:flex-start;gap:12px;text-align:left;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:16px;padding:14px 14px;font:inherit;line-height:1.4;width:100%;cursor:pointer;transition:.15s}.answer:active{transform:scale(.995)}.answer .letter{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:800}.answer.correct{border-color:var(--green);background:var(--greenbg)}.answer.correct .letter{background:var(--green);color:white}.answer.wrong{border-color:var(--red);background:var(--redbg)}.answer.wrong .letter{background:var(--red);color:white}.answer.dim{opacity:.72}.feedback{margin-top:14px;padding:13px 14px;border-radius:14px;background:var(--greenbg);color:var(--text);border:1px solid color-mix(in srgb,var(--green) 35%,var(--border));line-height:1.45}.warning{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--amberbg);border:1px solid color-mix(in srgb,var(--amber) 40%,var(--border));line-height:1.45}.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border);z-index:20}.nav-inner{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{appearance:none;border:0;background:transparent;color:var(--muted);padding:7px 3px;font:inherit;font-size:11px;font-weight:650;border-radius:12px}.nav button.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}.nav .icon{display:block;font-size:20px;margin-bottom:2px}.search{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);padding:13px 14px;border-radius:14px;font:inherit;outline:none}.search:focus{border-color:var(--accent)}.list-card{padding:15px;margin:8px 0}.list-card .qtext{font-weight:750;line-height:1.35;margin-bottom:10px}.mini-answer{padding:9px 10px;border-radius:10px;margin:6px 0;background:var(--bg);border:1px solid var(--border);font-size:14px;line-height:1.35}.mini-answer.good{background:var(--greenbg);border-color:color-mix(in srgb,var(--green) 45%,var(--border))}.mini-answer.bad{background:var(--redbg);border-color:color-mix(in srgb,var(--red) 45%,var(--border))}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:12px;background:var(--bg);border:1px solid var(--border);color:var(--muted)}.badge.good{color:var(--green);background:var(--greenbg)}.badge.bad{color:var(--red);background:var(--redbg)}.summary-item{border-top:1px solid var(--border);padding:14px 0}.summary-item:first-child{border-top:0}.summary-q{font-weight:750;line-height:1.35;margin-bottom:8px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;background:var(--card);border:1px solid var(--border);border-radius:16px}.stat .n{font-size:28px;font-weight:800}.block-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.block-btn{padding:10px 6px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:13px}.block-btn.done{background:var(--greenbg);border-color:color-mix(in srgb,var(--green) 40%,var(--border))}.empty{text-align:center;color:var(--muted);padding:40px 18px}.footer-note{color:var(--muted);font-size:12px;line-height:1.45;margin:14px 2px}.install-steps{margin:8px 0 0;padding-left:20px;line-height:1.6;color:var(--muted)}
@media(max-width:520px){.app{padding-left:12px;padding-right:12px}.hero h1{font-size:27px}.question{font-size:20px}.btnrow{grid-template-columns:1fr}.block-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main id="app" class="app"></main><nav class="nav"><div class="nav-inner"><button data-tab="test" class="active"><span class="icon">T</span>Тест</button><button data-tab="all"><span class="icon">СПИСОК</span>Усі</button><button data-tab="mistakes"><span class="icon">ПОМИЛКИ</span>Помилки</button><button data-tab="stats"><span class="icon">%</span>Прогрес</button></div></nav><script>window.QUESTIONS = [{"id":1,"sourceNumber":1,"text":"Як називається понижена частина річкової долини, по якій тече вода при найнижчих рівнях?","options":["русло або ложе долини річки;","дно або ложе долини річки;","коліно або ложе долини річки."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":2,"sourceNumber":2,"text":"Що вивчає річкова лоція?","options":["річки стосовно потреб судноводіння, тобто елементи річок, штучні та природні перешкоди в руслі річки, внутрішні течії, вітри, навігаційне перешкоди, розстановку навігаційних знаків;","річки стосовно потреб рибальства, тобто елементи річок, штучні та природні перешкоди в руслі річки, внутрішні течії, вітри, навігаційне перешкоди, розстановку навігаційних знаків;","річки стосовно потреб власників суден, тобто швидкість пересування судна по річці."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":3,"sourceNumber":3,"text":"Як називається понижена частина річкової долини, по якій тече вода при самих низьких рівнях?","options":["русло або ложе долини річки;","дно або ложе долини річки;","коліно або ложе долини річки."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":4,"sourceNumber":4,"text":"Як називається умовна лінія в середній частині суднового ходу?","options":["умовна лінія, що проходить по середині фарватеру, називається центр фарватеру;","умовна лінія, що проходить по середині фарватеру, називається вісь фарватеру;","умовна лінія, що проходить по середині фарватеру, називається серединою фарватеру."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":5,"sourceNumber":5,"text":"Як називається перехід суднового ходу від одного берега до другого?","options":["перекат;","навал;","перевал."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":6,"sourceNumber":6,"text":"Що є річковими перекочуваннями?","options":["перекати;","навали;","перевали."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":7,"sourceNumber":7,"text":"Що є річковими барами?","options":["вал з наносу впадаючих річок;","вал з наносу випливаючи річок;","перекат з наносу впадаючих річок."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":8,"sourceNumber":8,"text":"Для виміру яких відстаней на морі застосовується морська миля?","options":["основною одиницею вимірювання відстаней, прийнятої в морському судноводінні, є морська миля, рівна 1 хв. дуги земного меридіана, застосовується в округленому значенні - 1852 м;","основною одиницею вимірювання відстаней, прийнятої в морському судноводінні, є морська миля, рівна 1 хв. дуги земного меридіана, застосовується в округленому значенні - 1582 м;","основною одиницею вимірювання відстаней, прийнятої в морському судноводіння, є вузол."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":9,"sourceNumber":9,"text":"У яких одиницях проводяться виміри відстаней при плаванні на озерах і річках?","options":["основною одиницею вимірювання відстаней, прийнятої в річковому судноводіння є морська миля (1852 м);","основною одиницею вимірювання відстаней, прийнятої в річковому судноводіння є річкова миля (1852 м);","основною одиницею вимірювання відстаней, прийнятої в річковому судноводіння є кілометр (1000 м)."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":10,"sourceNumber":10,"text":"З яких основних засобів можна отримати навігаційну інформацію?","options":["найбільш важливим і оперативним документом є Морська карта України, в якому повідомляється про всі зміни в навігаційній обстановці і режиму плавання в морських і внутрішніх водних шляхах України. З метою забезпечення мореплавців навігаційно-гідрографічною і довідковою інформацією, необхідною для постійної підтримки карт і посібників з плавання на рівні сучасності, державна установа \"Держгідрографія\" готує і видає Морську карту України;","найбільш важливим і оперативним документом є Повідомлення мореплавцям України, в якому повідомляється про всі зміни в навігаційній обстановці і режиму плавання в морських і внутрішніх водних шляхах України. З метою забезпечення мореплавців навігаційно-гідрографічною і довідковою інформацією, необхідною для постійної підтримки карт і посібників з плавання на рівні сучасності, державна установа \"Держгідрографія\" готує і видає Повідомлення мореплавця України;","найбільш важливим і оперативним документом є Повідомлення судноводіям України, в якому повідомляється про всі зміни в навігаційній обстановці і режиму плавання в морських і внутрішніх водних шляхах України. З метою забезпечення мореплавців навігаційно-гідрографічною і довідковою інформацією, необхідною для постійної підтримки карт і посібників з плавання на рівні сучасності, державна установа \"Держгідрографія\" готує і видає Повідомлення судноводіям України."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":11,"sourceNumber":11,"text":"Одиницею виміру яких відстаней на морі є кабельтов?","options":["кабельтов - одиниця вимірювання відстаней, прийнятої в морському судноводіння - 1/10 морської милі, застосовується в округленому значенні - 185 м;","кабельтов - одиниця вимірювання швидкостей, прийнятої в морському судноводіння - 185 м/година;","кабельтов - одиниця вимірювання відстаней, прийнятої в морському судноводіння - 2/10 морської милі, застосовується в округленому значенні - 285 м."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":12,"sourceNumber":12,"text":"Якими показниками характеризується судновий хід?","options":["судновий хід (фарватер) на внутрішніх водних шляхах України характеризується шириною, глибиною, радіусом кривизни, а також висотою судноплавних прогонів мостів і різних комунікаційних повітряних ліній над річковою поверхнею води;","судновий хід (фарватер) на внутрішніх водних шляхах України характеризується відстанню між двох берегів, а також висотою судноплавних прогонів мостів і різних комунікаційних повітряних ліній над річковою поверхнею води;","судновий хід (фарватер) на внутрішніх водних шляхах України характеризується висотою судноплавних прогонів мостів і різних комунікаційних повітряних ліній над річковою поверхнею води."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":13,"sourceNumber":13,"text":"Як називається, короткий крутий вигин русла річки у межах долини?","options":["коліно;","вигин;","поворот."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":14,"sourceNumber":14,"text":"Річкова навігаційна карта це?","options":["основний штурманський посібник судноводія для забезпечення безпечного плавання на внутрішніх водних шляхах;","основний посібник судноводія для забезпечення безпечного плавання на внутрішніх водних шляхах;","основний посібник капітана для забезпечення безпечного плавання."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":15,"sourceNumber":15,"text":"Що таке морський стиковий бар? У яких місцях він створюється?","options":["морський стиковий бар - піщана підводна мілина в коліні річки, яка утворилась в результаті осадження річкових і морських наносів. Морський стиковий бар відгороджує коліні річки від моря і розташовується в місці стику річкової і морської течії;","морський стиковий бар - піщана надводна мілина в руслі річки, яка утворилась в результаті осадження річкових і морських наносів. Морський стиковий бар відгороджує русло річки від моря і розташовується в місці стику річкової і морської течії;","морський стиковий бар - піщана підводна мілина у гирлі річки, яка утворилась в результаті осадження річкових і морських наносів. Морський стиковий бар відгороджує гирло річки від моря і розташовується в місці стику річкової і морської течії."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":16,"sourceNumber":16,"text":"Що таке мис?","options":["ділянка суші, яка виступає гострим кутом в морі, озері, річки, може складатися, як корінними породами, так і наносами;","вузька смуга берега яка виступає кутом в морі, озері;","ділянка суші, яка виступає тупим кутом в морі, озері, річки, може складатися, як корінними породами, так і наносами."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":17,"sourceNumber":17,"text":"Як називається щорічно повторюваний підйом рівня води у зв'язку з сезонною зміною клімату і викликаний таненням снігу в басейні річки?","options":["повінь;","крижане сало;","буря."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":18,"sourceNumber":18,"text":"Як називається умовна лінія, що обмежує судновий хід?","options":["умовними лініями, які обмежують фарватер, по ширині називаються кромковими лініями (права кромка фарватеру; ліва кромка фарватеру);","умовними лініями, які обмежують судновий хід, по ширині називаються осьовими лініями (права осьова лінія; ліва осьова лінія);","умовними лініями, які обмежують фарватер, по ширині називаються обмежувальні лінії фарватеру."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":19,"sourceNumber":19,"text":"Як називається водний простір на річці для руху суден?","options":["кільватер;","судновий хід;","фарватер."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":20,"sourceNumber":20,"text":"Як називається знижена частина земної поверхні, розташована по обидві сторони річки на всьому її протязі?","options":["фарватер;","долина річки;","сувідь."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":21,"sourceNumber":21,"text":"Як називається частина річкової долини, затоплювана паводковими водами?","options":["заплава;","загата;","межень."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":22,"sourceNumber":21,"text":"Що означає термін \"Фарватер\" (судновий хід)?","options":["частина водного простору на внутрішніх водних шляхах спеціально виділена, перевірена, обстежена і позначена навігаційними знаками на місцевості і картах, та призначена для руху суден;","стійке наносне утворення у вигляді валу, яке перетинає русло річки;","ділянка суші, яка виступає гострим кутом в морі, озері, річці, може складатися, як корінними породами, так і наносами."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":23,"sourceNumber":22,"text":"Що означає термін \"Сувідь\"?","options":["обертальний рух води в річці за виступом берега. У правого берега води в суводі обертається за годинниковою стрілкою, у лівого навпаки. Сувідь може виникати і за штучною спорудою (наприклад, опори моста), яка огинається течею;","обертальний рух води в річці за виступом берега. У лівого берега води в суводі обертається за годинниковою стрілкою, у правого навпаки. Сувідь може виникати і за штучною спорудою (наприклад, опори моста), яка огинається течею;","обертальний рух води в морі за виступом берега. У правого берега води в суводі обертається за годинниковою стрілкою, у лівого навпаки. Сувідь може виникати і за штучною спорудою (наприклад, опори моста) яка огинається течею."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":24,"sourceNumber":23,"text":"Що відноситься до природних перешкод в руслі річок?","options":["піщана гряда, заструги, коса, дамба, затонина, побочні, висипка, шалига, осередок, острови;","піщана гряда, заструги, коса, закосок, затонина, побочні, висипка, шалига, осередок, острови;","піщана гряда, заструги, коса, закосок, затонина, побочні, висипка, сувідь, осередок, острови."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":25,"sourceNumber":24,"text":"Види неправильних течій у руслі річок?","options":["навальне (притискне), звалище (косоструйне), затяжне, сувідь, вир, тиховоди, майдан;","бар, звалище (косоструйне), затяжне, сувідь, вир, тиховоди, майдан;","навальне (притискне), звалище (косоструйне), затяжне, сувідь, вир, тиховоди, майдан, бар."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":26,"sourceNumber":25,"text":"Що називається загатою?","options":["штучне утворення на річці від скупчення деревини і таке інше;","утворення на річці від скупчення, нагромадження льоду, снігу і таке інше;","утворення на річці після скупчення, нагромадження льоду, снігу нижче за течею."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":27,"sourceNumber":26,"text":"Як називається накопичення наносів по ширині русла?","options":["гряда;","пойма;","кряж."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":28,"sourceNumber":27,"text":"Що називають ухвістям?","options":["верхня по течії частина острова;","плавний вигин русла річки;","нижня по течії частина острова."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":29,"sourceNumber":28,"text":"Як називається водний простір на річці, призначений для руху суден і позначений на місцевості і (або) на карті?","options":["фарватер;","русло;","перекат."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":30,"sourceNumber":29,"text":"Як називається стійке скупчення наносів, відкладених по ширині русла?","options":["перекат;","мис;","заплесок."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":31,"sourceNumber":30,"text":"Що відноситься до природних перешкод в руслі річок?","options":["піщана гряда, заструги, коса, закосок, затонина, побочні, висипка, шалига, осередок, острови;","піщана гряда, заструги, коса, дамба, затонина, побочні, висипка, шалига, осередок, острови;","піщана гряда, заструги, коса, закосок, затонина, побочні, висипка, сувідь, осередок, острови."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":32,"sourceNumber":31,"text":"Як називається старе русло - колишня ізлучина, випрямлена новим руслом і ізольована від нього?","options":["старик;","заплесок;","заплава."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":33,"sourceNumber":32,"text":"Як називається умовна лінія, що проходить у середній частині суднового ходу?","options":["вісь фарватеру;","ложе річки;","ухвістя."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":34,"sourceNumber":33,"text":"Що таке межень?","options":["низький рівень річкової води в весняний та осінній період;","низький рівень річкової води в літній та зимовий період;","низький рівень річкової води в літньо-осінній і зимовий період."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":35,"sourceNumber":34,"text":"Як називається обертальний рух води за підводним або надводним виступом в яру?","options":["заплесок;","русло;","вир."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":36,"sourceNumber":35,"text":"Штучні перешкоди в руслі річок це?","options":["гряда;","сувідь;","загата."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":37,"sourceNumber":36,"text":"Як називається наносне (без рослинності) надводне утворення в руслі, що омивається водою з усіх боків?","options":["осередок;","яр;","заплесок."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":38,"sourceNumber":37,"text":"Яким головним чином обумовлений гідрологічний, вітровий, хвильовий режим річок та водосховищ?","options":["наявністю: туману, хвилювання, сонця, коливання рівнів води:","наявністю: вітру, хвилювання, течії, коливання рівнів води;","наявністю: вітру, дощу, течії, коливання рівнів води."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":39,"sourceNumber":38,"text":"Як називається піщана мілина-бугор, утворена на судновому ході по випадковим причин: за затонулими предметами, за суднами, що стоять на мілині?","options":["вир;","осередок;","шалига."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":40,"sourceNumber":39,"text":"Як називається ділянка річки, де вода скоює безладні зворотно-поступальні рухи, утворюються при злитті потоків води з різними швидкостями течії, за опорами мостів, а також при обтіканні підводних перешкод, трохи нижче їх?","options":["кряж;","суводь;","загата."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":41,"sourceNumber":40,"text":"Як повинен діяти судноводій під час навала або зіткнення суден?","options":["зафіксувати пошкодження судна та місце пригоди;","продовжити рух до найближчого берегу;","з'ясувати кількість та стан постраждалих на суднах, оцінити розміри пошкодження суден та небезпеку їх затоплення."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":42,"sourceNumber":41,"text":"Визначте організаційну пріоритетність дій у разі аварійної ситуації:","options":["надання допомоги людям, починаючи з тих, хто найбільше цього потребує з мінімальною втратою часу;","здійснення заходів зі збереження судна, надання допомоги людям;","збереження судна, сповіщення відповідних органів влади про аварійну ситуацію."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":43,"sourceNumber":42,"text":"Як підходити до аварійного судна, яке знаходиться в дрейфі в притопленому стані, для надання допомоги людям?","options":["лагом до вітру та течії, з безпечною швидкістю;","проти вітру (течії), з безпечною швидкістю, зупинитися лагом до борту судна;","за вітром (течією), з безпечною швидкістю, до кормової частини судна."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":44,"sourceNumber":43,"text":"Як підходити до аварійного судна, що має великий крен для надання допомоги людям?","options":["лагом до вітру та течії, з безпечною швидкістю;","проти вітру (течії), з безпечною швидкістю, до частини судна, на якому найбільше скупчення людей;","за вітром (течією), з безпечною швидкістю, до кормової частини судна."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":45,"sourceNumber":44,"text":"Як підходити до аварійного судна, що має великий диферент (на ніс, корму) для надання допомоги людям?","options":["проти вітру (течії), з безпечною швидкістю, носом до частини судна, на якому найбільше скупчення людей та яке найбільше виглядає з води;","лагом до вітру та течії, з безпечною швидкістю, до частини судна, на якому найбільше скупчення людей та яке найбільше виглядає з води;","за вітром (течією), з безпечною швидкістю, до кормової частини судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":46,"sourceNumber":45,"text":"Як надати допомогу людям на прогулянковому/малому судні, якщо воно знаходиться у положенні \"уверх кілем\"?","options":["підходити до аварійного судна на максимальній швидкості, в першу чергу піднімати людей, які знаходяться під корпусом перевернутого судна;","підходити до судна на мінімальній швидкості, піднімати людей, які знаходяться на шляху судна;","підходити до аварійного судна на мінімальній швидкості, в першу чергу піднімати людей, які тримаються за борт перевернутого судна, перевірити наявність людей під корпусом перевернутого судна."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":47,"sourceNumber":46,"text":"Як підходити до перекинутого вітрильного судна?","options":["з мінімальною швидкістю та підвищеною обережністю;","зі звичайною швидкістю проти вітру;","зі звичайною швидкістю за вітром."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":48,"sourceNumber":47,"text":"Як підходити до судна, що на мілині?","options":["підходити лагом до судна на мілині з розрахунком зменшення глибини, при можливості зразу подати буксирний трос;","підходити до судна на мілині зі сторони берегу на мінімальній швидкості з розрахунком зменшення глибини;","підходити носом до судна на мілині, на мінімальній швидкості з розрахунком зменшення глибини."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":49,"sourceNumber":48,"text":"Як потрібно діяти при рятуванні людей, у разі пожежі на аварійному судні?","options":["підходити з підвітряної сторони з мінімальною швидкістю, оглядаючи водну поверхню навколо аварійного судна;","підходити з мінімальною швидкістю до корми судна, оглядаючи водну поверхню;","підходити з навітряної сторони з мінімальною швидкістю, оглядаючи водну поверхню навколо аварійного судна."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":50,"sourceNumber":49,"text":"Як повинен діяти судноводій, у разі сильного шторму?","options":["вибрати оптимальний курс та швидкість судна до найближчого сховища;","курсувати з максимальною швидкістю до місця призначення;","маневрувати, змінюючи швидкість для запобігання потрапляння води на борт судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":51,"sourceNumber":50,"text":"За допомогою яких засобів ліквідуються течі води, що стались від тріщин, швів, що розійшлися, невеликих пробоїни у корпусі прогулянкового/малого судна?","options":["аварійного обладнання;","аварійних пробок, клинів, паклі, мастіки;","ветоші, тенту, відра."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":52,"sourceNumber":51,"text":"На який факт вказує червоне світло ракети, пущеної з судна?","options":["екіпаж судна потребує медичної допомоги;","судно терпить лихо та потребує допомоги;","екіпаж судна проводить навчальні тривоги."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":53,"sourceNumber":52,"text":"У разі виникнення аварійної події на судні, судноводій повинен негайно повідомити будь-яким доступним способом:","options":["орган нагляду за судноплавством, капітана найближчого порту, судновласника;","судновласника та службу контролю за рухом суден та безпекою судноплавства;","орган виконавчої влади, що реалізує державну політику у сфері внутрішнього водного транспорту."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":54,"sourceNumber":53,"text":"В чому полягають вимоги Міжнародних правил для запобігання зіткненню суден на морі 1972 року (з поправками), щодо дії судноводіїв, по запобіганню аварійним подіям під час плавання?","options":["будь-яка дія для запобігання аварійної ситуація повинна бути впевнена, своєчасна, відповідати гарній морській практиці та правилам плавання;","необхідність дотримання безпеки на воді та охорони навколишнього середовища;","необхідність забезпечення безпеки життя людей та охорони навколишнього середовища."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":55,"sourceNumber":54,"text":"Червоне світло ракети з парашутом або фальшфеєр червоного кольору вказує на той факт, що:","options":["судно потребує паливно-мастильних матеріалів;","на судні проводяться навчальні тривоги;","судно терпить лихо та потребує допомоги."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":56,"sourceNumber":55,"text":"Дії судноводія щодо попередження зіткнення?","options":["своєчасна та рішуча зміна курсу судна чи (або) швидкості;","своєчасна зміна курсу судна;","суттєва зміна швидкості руху судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":57,"sourceNumber":56,"text":"Надання допомоги судну, що зазнало лиха на воді, здійснюється?","options":["обов'язково, після отримання дозволу рятувального координаційного центру;","обов'язково для кожного з суден, які знаходяться поруч;","обов'язково, тільки після наказу рятувального координаційного центру."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":58,"sourceNumber":57,"text":"Що повинні зробити водії прогулянкових/малих суден, які втратили хід та керування при зустрічному плаванні?","options":["повинні заздалегідь попередити зустрічні судна про втрату керування за допомогою відмашки червоним прапором удень, червоним або білим вогнем уночі;","повинні заздалегідь попередити зустрічні судна про втрату керування за допомогою відмашки білим прапором удень та білим вогнем уночі;","негайно зайнятися ремонтними роботами для якнайшвидшого відновлення ходу та керування судном."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":59,"sourceNumber":58,"text":"Які дії, виконуються при надані допомоги аварійному судну, під час сильного вітру і хвилюванні, якщо воно втратило хід і керованість?","options":["підхід судна для заведення буксируваного тросу, та буксирування аварійного судна до порту;","надання допомоги для постановки аварійного судна на якір, та заведення буксируваного тросу;","підхід до борту аварійного судна, швартування, буксирування лагом до порту."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":60,"sourceNumber":59,"text":"Що повинен робити судноводій, у разі аварії, що становить небезпеку для осіб, які перебувають на борту?","options":["використовувати всі наявні в його розпорядженні засоби для порятунку цих осіб;","встати на якір та поінформувати портові органи про необхідну допомогу;","поінформувати портові органи про необхідну допомогу та чекати допомогу."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":61,"sourceNumber":60,"text":"Кого повинен сповістити судноводій, у раз потрапляння судна на мілину або у разі його затоплення?","options":["судновласника та найближчій структурний підрозділ Адміністрації судноплавства;","найближчі структурні підрозділи Річкової інформаційної служби та державну установу \"Держгідрографія\";","судновласника і найближчий підрозділ державного підприємства \"Класифікаційне товариство \"Регістр судноплавства України\"."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":62,"sourceNumber":61,"text":"Кого повинен попередити судноводій, якщо аварія відбулася при проході через шлюз?","options":["судновласника;","диспетчера шлюзу;","Адміністрацію судноплавства."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":63,"sourceNumber":62,"text":"Кого повинен сповістити судноводій, якщо судно пошкодить гідротехнічну споруду або міст?","options":["відповідні структурні підрозділи Річкової інформаційної служби та державну установу \"Держгідрографія\";","відповідні структурні підрозділи Річкової інформаційної служби та державне підприємство \"Класифікаційне товариство \"Регістр судноплавства України\";","відповідні структурні підрозділи Адміністрації судноплавства та державну установу \"Держгідрографія\"."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":64,"sourceNumber":63,"text":"Який порядок повідомлення про аварійні/транспортні події із суднами?","options":["негайно повідомити всіма можливими засобами зв'язку найближчий структурний підрозділ Адміністрації судноплавства, Міністерство розвитку громад, територій та інфраструктури України, судновласника та технічну дільницю шляху, з одночасним вжиттям заходів щодо ліквідації наслідків транспортної події;","негайно повідомити всіма можливими засобами зв'язку найближчий структурний підрозділ Річкової інформаційної служби, Міністерство розвитку громад, територій та інфраструктури України та судновласника, з одночасним вжиттям заходів щодо ліквідації наслідків транспортної події;","негайно повідомити всіма можливими засобами зв'язку найближчий структурний підрозділ Міністерства розвитку громад, територій та інфраструктури України, державну установу \"Держгідрографія\" та судновласника, з одночасним вжиттям заходів щодо ліквідації наслідків транспортної події."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":65,"sourceNumber":64,"text":"Як повинен діяти судноводій, у разі аварійного випадку з прогулянковим/малим судном?","options":["необхідно скласти акт, додавши відповідну схему руху, та повідомити найближчий підрозділ державного підприємства \"Класифікаційне товариство \"Регістр судноплавства України\";","необхідно скласти акт, додавши відповідну схему руху, та повідомити найближчий підрозділ Адміністрації судноплавства;","необхідно скласти акт, додавши відповідну схему руху, та повідомити найближчий підрозділ державної установи \"Держгідрографії\"."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":66,"sourceNumber":65,"text":"Які дії судноводія при неможливості усунення водотічності і надходження великих мас води, які загрожують затопленню судна?","options":["проводити безперервну відкачку води, слідувати до місця укриття або мілини, звернутися за допомогою до найближчих суден або рятувальників, оголосити \"шлюпкову\" тривогу;","припинити відкачку води, слідувати до місця укриття або мілини, звернутися за допомогою до найближчих суден або рятувальників, оголосити \"шлюпкову\" тривогу;","припинити відкачку води, зупинити рух судна, звернутися за допомогою до найближчих суден або рятувальників, оголосити \"шлюпкову\" тривогу."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":67,"sourceNumber":66,"text":"Які першочергові дії судноводія у разі виходу з ладу двигуна?","options":["вжити відповідних заходів щодо негайної безпечної віддачі якоря для зупинки руху судна;","вжити відповідних заходів щодо безпечної віддачі якоря після зупинки руху судна;","вжити відповідних заходів щодо безпечного виходу за межи суднового ходу (фарватеру) та постановки судна якір."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":68,"sourceNumber":67,"text":"Чи може судноводій відмовити потерпілому на воді в доставці його у лікарняні заклади?","options":["не може відмовити у будь-яких ситуаціях;","допомога надається за бажанням;","може відмовити, якщо немає загрози життю потерпілого."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":69,"sourceNumber":68,"text":"В денний час доби, судноводій прогулянкового/малого судна бачить судно, яке на видному місці несе знак, що складається з квадратного прапора з кулею, що знаходиться під ним. Що це означає?","options":["судно на якорі;","судно, зайняте днопоглиблювальними роботами;","судно, яке терпить лихо та потребує допомоги."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":70,"sourceNumber":69,"text":"Чи дозволяється судноводію прогулянкового/малого судна перевозити пасажирів, що знаходяться в стані алкогольного або наркотичного сп'яніння будь-якого ступеня?","options":["дозволяється;","на розсуд судноводія;","забороняється."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":71,"sourceNumber":70,"text":"Що повинен знати судноводій прогулянкового/малого судна при перевезенні вибухових та вогненебезпечних вантажів?","options":["перевезення вибухових та вогненебезпечних вантажів прогулянковим/малим судном, яке не
