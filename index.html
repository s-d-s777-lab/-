н вжити всіх заходів обережності, щоб розходження відбулася в місці і умовах, які забезпечили б безпечне розходження судна;","положення суден, вказане на малюнку, відповідає ситуації коли два судна йдуть назустріч один одному і має місце небезпечне зближення. Судна повинні розходитися лівими бортами. В даному випадку, коли відсутня судноплавна обстановка, кожен з судноводіїв повинен вжити всіх заходів обережності, щоб розходження відбулася в місці і умовах, які забезпечили б безпечне розходження судна."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":218,"sourceNumber":216,"text":"В яких випадках прогулянковому/малому судну дозволено заходити та маневрувати на акваторії пляжів?","options":["дозволяється, при умовах безпечного плавання.","забороняється завжди;","дозволяється при необхідності."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":219,"sourceNumber":217,"text":"Як називається кут відхилення судна від курсу під дією вітру?","options":["кут курсу;","кут дрейфу;","кут вітру."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":220,"sourceNumber":218,"text":"Якщо два моторних судна йдуть пересічними курсами так, що виникає небезпека зіткнення, яке судно повинно поступитися шляхом іншому судну?","options":["те судно, яке має інше на своїй правій стороні, повинно поступитися шляхом;","те судно, яке має більшу швидкість, повинно поступитися шляхом;","те судно, яке має інше на своїй лівій стороні, повинно поступитися шляхом."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":221,"sourceNumber":219,"text":"Який порядок розходження прогулянкових/малих суден, що відійшли від різних берегів назустріч один одному, при небезпечному зближенні?","options":["в даному випадку судна повинні розходиться лівими бортами при цьому поступається шляхом і першим подає відмашку на розходження судно, що відійшло від правого берега. Умови по процедурі розходження аналогічні ситуації при зустрічному зближенні двох суден, що йдуть вгору і вниз;","в даному випадку судна повинні розходиться правими бортами при цьому поступається шляхом і першим подає відмашку на розходження судно, що відійшло від правого берега. Умови по процедурі розходження аналогічні ситуації при зустрічному зближенні двох суден, що йдуть вгору і вниз;","в даному випадку судна повинні розходиться лівими бортами при цьому поступається шляхом і першим подає відмашку на розходження судно, що відійшло від лівого берега. Умови по процедурі розходження аналогічні ситуації при зустрічному зближенні двох суден, що йдуть вгору і вниз."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":222,"sourceNumber":220,"text":"Чи допускається при плаванні по підхідному каналу взаємний обгін суден усіх видів?","options":["забороняється лише у темний час доби;","дозволяється з дозволу начальника вахти шлюзу;","забороняється."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":223,"sourceNumber":221,"text":"Обгін дозволяється лише у випадку, коли його можливо здійснити:","options":["без зміни швидкості судна, що обганяють;","фарватер є досить широким;","упевнившись в безпечності."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":224,"sourceNumber":222,"text":"Який порядок і пріоритетність розходження суден при зустрічному плаванні?","options":["при зустрічному плаванні судна, що йдуть вверх, повинні, враховуючи місцеві умови і рух інших суден, звільняти шлях суднам, що йдуть вниз;","при зустрічному плаванні судна, що йдуть вниз, повинні, враховуючи місцеві умови і рух інших суден, звільняти шлях суднам, що йдуть вверх;","при зустрічному плаванні судна повинні обмінятися відповідними сигналами, для уточнення пріоритетності проходження."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":225,"sourceNumber":223,"text":"Які дії судноводія якщо два судна йдуть курсами, що перетинаються таким чином, що може виникнути небезпека зіткнення?","options":["судно, що бачить інше судно по правому борту, повинне дати йому дорогу і, якщо дозволяють обставини, уникнути перетинання його курсу попереду. Однак судно, що йде правим боком фарватеру, повинне продовжувати йти своїм курсом;","судно, що бачить інше судно по лівому борту, повинне дати йому дорогу і, якщо дозволяють обставини, уникнути перетинання його курсу попереду. Однак судно, що йде правим боком фарватеру, повинне продовжувати йти своїм курсом;","судно, що бачить інше судно по правому борту, повинне дати йому дорогу і, якщо дозволяють обставини, уникнути перетинання його курсу попереду. Однак судно, що йде лівим боком фарватеру, повинне продовжувати йти своїм курсом."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":226,"sourceNumber":224,"text":"З якого борту необхідне обходити судно при обгоні?","options":["при перетині фарватеру, обгін можна здійснювати, тільки по лівому борту судна, яке обганяють;","при перетині фарватеру, обгін можна здійснювати, тільки по правому борту судна, яке обганяють;","обидві відповіді вірні."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":227,"sourceNumber":225,"text":"Яке судно повинно дати дорогу, якщо два судна йдуть курсами, що перетинаються?","options":["якщо два судна йдуть курсами, що перетинаються таким чином, що може виникнути небезпека зіткнення, то судно, що йде лівим боком до фарватеру, повинне дати дорогу;","якщо два судна йдуть курсами, що перетинаються таким чином, що може виникнути небезпека зіткнення, то судно, що бачить інше судно по правому борту, повинне дати дорогу;","якщо два судна йдуть курсами, що перетинаються таким чином, що може виникнути небезпека зіткнення, то судно, що бачить інше судно по лівому борту, повинне дати дорогу."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":228,"sourceNumber":226,"text":"Який світло імпульсний сигнал (відмашку) вночі, повинне подати судно, яке йде вверх і звільняє шлях судну, що йде униз із правого борту?","options":["часто проблисковим ясним червоним вогнем, одночасно може подаватися також відмашка світло-блакитним щитом;","часто проблисковим ясним білим вогнем, одночасно може подаватися також відмашка світло-блакитним щитом;","часто проблисковим ясним жовтим вогнем, одночасно може подаватися також відмашка світло-блакитним щитом."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":229,"sourceNumber":227,"text":"Що повинен зробити судноводій торгівельного судна у випадку коли його обганяє прогулянкове/мале судно?","options":["судно, що обганяють, повинне при необхідності і можливості полегшити обгін, зменшивши швидкість;","судноводій повинен упевнитись в тому, що обгін не становить небезпеки;","судноводій торгівельного судна не повинен виконувати дії пов'язанні з полегшенням обгону."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":230,"sourceNumber":228,"text":"У якому випадку дозволено обгін судна?","options":["між суднами обгін дозволяється тільки тоді, коли судно, що обганяє повністю впевнено, що маневр по обгону відбудеться безпечно. Судно, що обганяє, може обходити судно, що обганяють, з будь якого борту, якщо видимість не менше ніж 500 м. Судно яке здійснює обгін має триматися осторонь від шляху судна якого обганяє;","між суднами обгін дозволяється тільки тоді, коли судно, що обганяє повністю впевнено, що маневр по обгону відбудеться безпечно. Судно, що обганяє, повинне обходити судно, що обганяють, з лівого борту. Коли фарватер є досить широким, судно, що обганяє, може також обходити судно, що обганяють, з правого борту;","між суднами обгін дозволяється тільки тоді, коли судно, що обганяє повністю впевнено, що маневр по обгону відбудеться безпечно. Судно, що обганяє, повинне обходити судно, що обганяють, винятково з лівого борту. Судно яке здійснює обгін має триматися осторонь від шляху судна якого обганяє."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":231,"sourceNumber":229,"text":"Коли судно вважається таким, що обганяє інше судно?","options":["судно вважається таким, що обганяє інше судно, коли воно бачить інше прямо або майже по курсу, ліворуч чи праворуч, і при цьому вночі воно може бачити в створі або майже в створі топові вогні та (або) обидва бортових вогні іншого судна, а вдень воно спостерігає його відповідний ракурс;","судно вважається таким, що обганяє інше судно, коли воно підходить до нього з напрямку більше 22,5 град. позаду траверзу останнього, тобто судно, що обганяє знаходиться в такому положенні по відношенню до судна, що обганяється, що ночі судно, що обганяє, може бачити тільки кормовий вогонь судна, що обганяється і не може бачити жоден з його бортових вогнів;","судно вважається таким, що обганяє інше судно, коли воно бачить інше прямо або майже по курсу, і при цьому вночі воно може бачити в створі або майже в створі топові вогні та (або) обидва бортових вогні іншого судна, а вдень воно спостерігає його відповідний ракурс."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":232,"sourceNumber":230,"text":"За допомогою чого високошвидкісні судна узгоджують між собою зустрічне плавання?","options":["мобільного та радіозв'язку;","річкової інформаційної служби;","в денний час за допомогою флага-відмашки, в нічний час за допомогою світлоімпульсного сигналу (відмашки)."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":233,"sourceNumber":231,"text":"Які звуки судна подають у разі обгону з лівого боку?","options":["один тривалий звук та два коротких звука;","два коротких звука та один тривалий звук;","два тривалих звука та два коротких звука."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":234,"sourceNumber":232,"text":"Які звуки судна подають у разі обгону з правого боку?","options":["два тривалих звука та один короткий звук;","два тривалих звука та два коротких звука;","один тривалий звук та один короткий звук."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":235,"sourceNumber":233,"text":"При здійсненні повороту праворуч або маневру, які сигнали подаються судном?","options":["один тривалий звук та один короткий звук;","два тривалих звука та один короткий звук;","один тривалий звук та два коротких звука."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":236,"sourceNumber":234,"text":"На яких ділянках забороняється розходження та обгін суден (складів суден) при обмеженій видимості?","options":["де судновий хід має ширину менше 200 м, та якщо візуальна видимість становить менше 1000 м;","де судновий хід має ширину менше 200 м, та якщо візуальна видимість становить менше трьох довжин судна (складу суден);","де судновий хід має ширину менше 100 м, та якщо візуальна видимість становить менше двох довжин судна (складу суден)."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":237,"sourceNumber":235,"text":"Коли існує вірогідність зіткнення, то судно, що обганяє інше судно ліворуч, повинне подати:","options":["\"Два тривалих звуки та один короткий звук\", цей звуковий сигнал означає: \"Хочу обійти на вашу лівому борту\";","\"Три тривалих звуки та три коротких звуки\", цей звуковий сигнал означає: \"Хочу обійти на вашу лівому борту\";","\"Два тривалих звуки та два коротких звуки\", цей звуковий сигнал означає: \"Хочу обійти на вашу лівому борту\"."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":238,"sourceNumber":236,"text":"Судно, що обганяють з лівого боку, повинне подати сигнал:","options":["\"Три коротких звука\", який означає - \"Згоден, обходьте по моєму лівому борту\";","\"Два коротких звука\", який означає - \"Згоден, обходьте по моєму лівому борту\";","\"Один короткий звук\", який означає - \"Згоден, обходьте по моєму лівому борту\"."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":239,"sourceNumber":237,"text":"Коли обгін неможливий через небезпеку зіткнення судно, що обганяють повинне подати?","options":["\"Шість, коротких звуків\", що означає: \"Мене обганяти не можна\";","\"П'ять, коротких звуків\", що означає: \"Мене обганяти не можна\";","\"Чотири, коротких звуків\", що означає: \"Мене обганяти не можна\"."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":240,"sourceNumber":238,"text":"Як необхідно діяти водієві гідроциклу при перетині хвильового сліду від минулого судна?","options":["зменшити швидкість та перетинати перпендикулярно хвильовому сліду;","збільшити швидкість та перетинати перпендикулярно хвильовому сліду;","перетинати під кутом не менше 30 градусів хвильовому сліду, не зменшуючи швидкості."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":241,"sourceNumber":239,"text":"В якому випадку гідроцикл стає некерованим?","options":["під час руху на мінімальній швидкості;","під час руху з непрацюючим двигуном;","під час руху за вітром."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":242,"sourceNumber":240,"text":"Варіанти швидкого зменшення швидкості гідроциклу?","options":["натиснути важіль гальм справа на кермі;","відпустити важіль руху вперед;","вимкнення гідроциклу."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":243,"sourceNumber":241,"text":"Як повинні маневрувати гідроцикли для розходження один з одним і іншими моторними плавзасобами на акваторії, що не має судноплавної обстановки?","options":["розходження правими бортами;","розходження лівими бортами;","не заважати руху іншим суднам, триматися в стороні."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":244,"sourceNumber":242,"text":"Які дії повинно зробити судно, якому поступаються дорогою?","options":["зберігати курс та швидкість судна;","зменшити швидкість руху;","подати відмашку прапором."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":245,"sourceNumber":243,"text":"Як необхідно діяти судноводію гідроциклу при перетині хвильового сліду від пройденого судна?","options":["зменшити швидкість та перетинати перпендикулярно хвильовому сліду;","збільшити швидкість та перетинати перпендикулярно хвильовому сліду;","перетинати під кутом не менше 30 градусів хвильовому сліду, не зменшуючи швидкості."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":246,"sourceNumber":244,"text":"При повороті оверштаг вітрильне судно:","options":["змінює галс, перетинаючи носом лінію напрямку вітру;","здійснює поворот на 180 градусів на мінімальній швидкості;","здійснює поворот на мінімальній швидкості."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":247,"sourceNumber":245,"text":"При повороті через фордевінд вітрильне судно:","options":["змінює галс, перетинаючи кормою лінію напрямку вітру;","здійснює поворот на 180 градусів на мінімальній швидкості;","здійснює поворот на мінімальній швидкості."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":248,"sourceNumber":246,"text":"Як називається зигзагоподібний рух вітрильного судна, коли судно лягає то на лівий галс, то на правий?","options":["маневрування;","рискання;","лавірування."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":249,"sourceNumber":247,"text":"За якої умови судно йде у бейдевінд?","options":["кут між напрямом вітру і напрямом руху судна менший за 90 градусів;","кут між напрямом вітру і напрямом руху судна більший за 90 градусів;","кут між напрямом вітру і напрямом руху судна дорівнює 90 градусів."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":250,"sourceNumber":248,"text":"За якої умови судно йде у бакштаг?","options":["кут між напрямом вітру і напрямом руху судна більший ніж 8, але менший ніж 16 румбів;","кут між напрямом вітру і напрямом руху судна менший ніж 8 румбів;","кут між напрямом вітру і напрямом руху судна менший за 45 градусів."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":251,"sourceNumber":249,"text":"Що означає сигнал \"два тривалих звуки та два коротких звуки\", який подається судном, що обганяє?","options":["\"Хочу обійти по вашому правому борту\";","\"Хочу пройти лівим бортом\";","\"Хочу обійти по вашому лівому борту\"."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":252,"sourceNumber":250,"text":"Який колір та порядок розташування бортових вогнів?","options":["на правому борту - зелений, на лівому борту - червоний;","на правому борту - зелений, на лівому борту - помаранчевий;","на правому борту - червоний, на лівому борту - зелений."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":253,"sourceNumber":251,"text":"Що позначає знак: \"Дотримуватись надводного габариту!\"?","options":["для позначення надводних і мостових переходів. Цифра показує допустиму прохідну висоту надводного переходу, висоту підмостового судноплавного габариту судноплавного прогону мосту від розрахункового високого судноплавного рівня води або максимального судноплавного рівня води (м);","для позначення надводних і мостових переходів. Цифра показує максимальну прохідну висоту надводного переходу, висоту підмостового судноплавного габариту судноплавного прогону мосту від розрахункового високого судноплавного рівня води або максимального судноплавного рівня води (м);","для позначення надводних і мостових переходів. Цифра показує мінімальну прохідну висоту надводного переходу, висоту підмостового судноплавного габариту судноплавного прогону мосту від розрахункового високого судноплавного рівня води або максимального судноплавного рівня води (м)."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":254,"sourceNumber":252,"text":"На яких мінімальних відстанях, згідно вимог Міжнародних правил для запобігання суден на морі 1972 року, з поправками, повинні бути видимі вогні, встановленні на суднах довжиною менше 12 метрів?","options":["топовий вогонь - 2 милі, бортовий вогонь - 1 миля, кормовий вогонь - 1 милі, буксирувальний вогонь - 2 милі, білий, червоний, зелений або жовтий круговий вогонь - 2 милі;","топовий вогонь - 1 милі, бортовий вогонь - 1 миля, кормовий вогонь - 2 милі, буксирувальний вогонь - 2 милі, білий, червоний, зелений або жовтий круговий вогонь - 2 милі;","топовий вогонь - 2 милі, бортовий вогонь - 1 миля, кормовий вогонь - 2 милі, буксирувальний вогонь - 2 милі, білий, червоний, зелений або жовтий круговий вогонь - 2 милі."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":255,"sourceNumber":253,"text":"Які вогні має нести прогулянкове/мале судно на стоянці, за винятком суднових шлюпок, вночі?","options":["вночі один звичайний жовтий круговий вогонь;","вночі один звичайний білий круговий вогонь;","вночі один звичайний зелений круговий вогонь."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":256,"sourceNumber":254,"text":"Як потрібно проводити перетин фарватеру (суднового ходу) судноводію прогулянкового/малого судна?","options":["прогулянкове/мале судно може перетинати фарватер тільки поза межами міста, в найкоротший термін, тобто під кутом близьким до 90° по відношенню до осі фарватеру і з максимальною швидкістю;","прогулянкове/мале судно може перетинати фарватер в спеціально визначених місцях, в найкоротший термін, тобто під кутом близьким до 90° по відношенню до осі фарватеру і з максимальною швидкістю;","прогулянкове/мале судно може перетинати фарватер в разі і місці, коли це йому дозволено Правила судноплавства на внутрішніх водних шляхах України, в найкоротший термін, тобто під кутом близьким до 90° по відношенню до осі фарватеру і з максимальною швидкістю."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":257,"sourceNumber":255,"text":"Термін \"база для стоянки маломірних (малих) суден\" - це?","options":["суб'єкт господарювання, одним зі статутних напрямів діяльності якого є надання послуг з безпечного утримання маломірних (малих) суден і який утримує і використовує спеціально обладнані для цього гідротехнічні споруди або природні берегові об'єкти, за винятком баз та інших пунктів базування суден флоту рибного господарства;","територія із спорудами та прилеглої до неї акваторією, в межах якої базуються маломірні (малих) суден;","берегова територія із спорудами та прилеглої до неї акваторією, в межах якої базуються не менш ніж 20 маломірних (малих) суден."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":258,"sourceNumber":256,"text":"Чи дозволяється рух прогулянковим/малим суднам у темний час доби (від заходу та сходу сонця)?","options":["у межах міста або інших населених пунктах рух маломірних суден дозволяється як у світлий так і в темний час доби, за умов дотримання Правилам судноплавства на внутрішніх водних шляхах України зі швидкістю 10 км/год (у нічний час), при умові несення ходових вогнів. На інших судноплавних ділянках рух таких суден у нічний час дозволяється лише зі швидкістю 15 км/год, при умові несення вогнів згідно з встановленими Правилами судноплавства на внутрішніх водних шляхах України, з правом перетину суднового ходу у не заборонених місцях;","у межах міста або інших населених пунктах рух маломірних суден дозволяється лише у світлий час доби. На інших судноплавних ділянках рух таких суден у нічний час дозволяється лише зі швидкістю 10 км/год, при умові несення вогнів згідно з встановленими Правилами судноплавства на внутрішніх водних шляхах України, без права перетину суднового ходу;","у межах міста або інших населених пунктах рух маломірних суден дозволяється лише у світлий час доби. На інших судноплавних ділянках рух таких суден у нічний час дозволяється лише зі швидкістю 15 км/год, при умові несення вогнів згідно з встановленими Правилами судноплавства на внутрішніх водних шляхах України, без права перетину суднового ходу."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":259,"sourceNumber":257,"text":"Як рекомендовано виконувати перетин курсу іншого судна?","options":["перетин курсу іншого судна рекомендується виконувати по носу судна. Допускається перетин курсу за його кормою судна за умови, що після закінчення маневру перетину до судна, що наближається, залишається не менше 500 м. Прогулянкові/малі судна, які перетинають судновий хід, повинні пропустити усі судна, які рухаються по судновому ходу;","перетин курсу іншого судна рекомендується виконувати за його кормою. Допускається перетин курсу по носу судна за умови, що після закінчення маневру перетину до судна, що наближається, залишається не менше 500 м. Прогулянкові/малі судна, які перетинають судновий хід, повинні пропустити усі судна, які рухаються по судновому ходу;","перетин курсу іншого судна рекомендується виконувати за його кормою. Допускається перетин курсу по носу судна за умови, що після закінчення маневру перетину до судна, що наближається, залишається не менше 300 м. Прогулянкові/малі судна, які перетинають судновий хід, повинні пропустити судна, які рухаються по судновому ходу вверх."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":260,"sourceNumber":258,"text":"З якою швидкістю дозволяється рух прогулянковим/малим суднам в нічний час?","options":["дозволяється зі швидкістю 5 км/год, за умови несення ходових вогнів необхідних згідно з встановленими Правилами судноплавства на внутрішніх водних шляхах України, при видимості не менше 400 м, без права перетину фарватеру і без права руху в межах міста або інших населених пунктах;","дозволяється зі швидкістю 15 км/год, за умови несення ходових вогнів необхідних згідно з встановленими Правилами судноплавства на внутрішніх водних шляхах України, при видимості не менше 500 м, без права перетину фарватеру і без права руху в межах міста або інших населених пунктах;","дозволяється зі швидкістю 15 км/год, за умови несення ходових вогнів необхідних згідно з встановленими Правилами судноплавства на внутрішніх водних шляхах України, при видимості не менше 1000 м, без права перетину фарватеру і без права руху в межах міста."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":261,"sourceNumber":259,"text":"Де дозволено перетинати судновий хід в межах міста?","options":["тільки в встановлених місцях, тільки в денний час доби тільки при видимості не менше 1000 м і в найкоротший термін;","тільки в встановлених місцях, тільки при видимості не менше 500 м і в найкоротший термін;","тільки в денний час доби тільки при видимості не менше 1000 м і в найкоротший термін."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":262,"sourceNumber":260,"text":"У разі виникнення небезпеки, судна що прямують уверх, які сигнали повинні подати?","options":["у разі неясності дій інших суден, неподання або неправильному підтвердження сигналів, втрати орієнтування, невпевненості в оцінці ситуації, судноводій прогулянкового/малого судна, що йде вгору, має знизити швидкість, аж до зупинки судна щодо берега (дна) і розібратися в обстановці.","у разі неясності дій інших суден, неподання або неправильному підтвердження сигналів, втрати орієнтування, невпевненості в оцінці ситуації, судноводій прогулянкового/малого судна, що йде вгору має подати звукові сигнали що повинні супроводжуватися синхронно світловими сигналами, що мають зелений колір і сектор освітлення 360°, як вдень, так і вночі;","у разі виникнення небезпеки, судноводій прогулянкового/малого судна що йде вгору, має знизити швидкість, аж до зупинки судна відносно берега (дна) і розібратися в обстановці."],"correct":[],"status":"ambiguous-source","note":"У вихідному переліку немає варіанта «серія дуже коротких звуків», який відповідає правилу для сигналу небезпеки. Питання не оцінюється.","needsImage":false,"scorable":false},{"id":263,"sourceNumber":261,"text":"Де повинні рухатись прогулянкові/малі судна по відношенню фарватеру?","options":["по центру фарватеру;","за межами фарватеру;","по лівій кромці фарватеру."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":264,"sourceNumber":262,"text":"Як здійснюється поворот суднами?","options":["усі судна можуть здійснювати поворот (оборот), як вліво, так і вправо, лише у спеціально визначених місцях;","поворот суднами здійснюється у будь якому місті, за умов дотримання правил судноплавства;","усі судна можуть здійснювати поворот (оборот), як вліво, так і вправо, лише після того, як вони переконалися в тому, що рух інших суден дає їм можливість це зробити без ризику і, що інші судна не будуть змушені раптово змінювати свій курс або швидкість."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":265,"sourceNumber":263,"text":"Які ходові вогні повинно нести одиночне прогулянкове/мале судно, довжиною до 7 метрів, у нічний час?","options":["тільки білий звичайний кормовий вогонь;","тільки жовтий звичайний круговий вогонь;","тільки білий звичайний круговий вогонь."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":266,"sourceNumber":264,"text":"Які ходові вогні повинно нести одиночне прогулянкове/мале судно, довжиною понад 7 метрів, у нічний час?","options":["топовий, бортові, круговий;","топовий, кормовий;","топовий, бортові, кормовий."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":267,"sourceNumber":265,"text":"Які вогні повинно нести вночі буксируюче судно довжиною менше 50 м на ходу?","options":["три топових вогні, розташованих один над одним в передній частині по осі судна, бортові вогні, білий кормовий вогонь;","два топових вогні, розташованих один над одним в передній частині по осі судна, бортові вогні, жовтий кормовий вогонь;","три топових вогні, розташованих один над одним в передній частині по осі судна, бортові вогні, жовтий кормовий вогонь."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":268,"sourceNumber":266,"text":"Де дозволяється зупинятись прогулянковим/малим суднам у межах суднового ходу?","options":["забороняється зупинятися в межах фарватеру;","в спеціально визначених знаками судового ходу місцях;","виключно поза межами міста."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":269,"sourceNumber":267,"text":"Які вогні повинно мати прогулянкове/мале судно при стоянці на якорі?","options":["один жовтий круговий вогонь;","один білий круговий вогонь;","топовий та кормовий вогні."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":270,"sourceNumber":268,"text":"Який знак вказує на перехід фарватеру від одного берега до іншого?","options":["\"Рух маломірних суден заборонено\";","\"Розходження дозволено\";","\"Перевальний\"."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":271,"sourceNumber":269,"text":"З якою швидкістю прогулянкові/малі судна повинні рухатися уздовж границь пляжів?","options":["15 км/год;","5 км/год;","10 км/год."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":272,"sourceNumber":270,"text":"При якій видимості дозволяється рух прогулянкових/малих суден?","options":["не менше ніж 300 м, а в межах фарватеру, в дозволених випадках, не менше ніж 500 м;","не менше ніж 500 м, а в межах фарватеру, в дозволених випадках, не менше ніж 1000 м;","не менше ніж 1000 м, а в межах фарватеру, в дозволених випадках, не менше ніж 500 м."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":273,"sourceNumber":271,"text":"Особи, якого віку допускаються до керування прогулянковим/малим судном?","options":["допускаються до керування судном особи не молодше 18-ти років, які при собі мають документи на право керування судном із зазначенням відповідної категорії судна і дозволеного району плавання;","допускаються до керування судном особи не молодше 16-ти років, які при собі мають документи на право керування судном із зазначенням відповідної категорії судна і дозволеного району плавання;","допускаються до керування судном особи не молодше 21-го року, які при собі мають документи на право керування судном із зазначенням відповідної категорії судна і дозволеного району плавання."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":274,"sourceNumber":272,"text":"Яка мінімальна відстань для обміну відмашками для прогулянкових/малих суден?","options":["не менше ніж за 200 м. Першим подає відмашку на розходження (пропуск) судно, що йде вгору;","не менше ніж за 300 м. Першим подає відмашку на розходження (пропуск) судно, що йде вгору;","не менше ніж за 250 м. Першим подає відмашку на розходження (пропуск) судно, що йде вниз."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":275,"sourceNumber":273,"text":"Будь-яке судно, зайняте водолазними роботами, на додаток до сигналізації передбаченої правилами, повинно нести?","options":["сигнальний червоний прапор, як вдень так і вночі;","сигнальний блакитний прапор, як вдень так і вночі;","сигнальний прапор (щит) \"А\", як вдень так і вночі."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":276,"sourceNumber":274,"text":"Які правила руху під мостами для прогулянкових/малих суден?","options":["прохід під мостами дозволяється зі швидкістю 10 км/год. Забороняється обгін під мостами і в 200-метровій зоні, прилеглій до мосту, а також коли на траверзі вже є два судна;","прохід під мостами дозволяється зі швидкістю 5 км/год. Забороняється обгін під мостами і в 100-метровій зоні, прилеглій до мосту, а також коли на траверзі вже є два судна;","прохід під мостами дозволяється зі швидкістю 15 км/год. Забороняється обгін під мостами і в 100-метровій зоні, прилеглій до мосту, а також коли на траверзі вже є два судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":277,"sourceNumber":275,"text":"В яких випадках заборонено виходити в плавання прогулянковим/малим суднам?","options":["з порушенням термінів відкриття та закриття навігації, на технічно не справному судні;","при відсутності у судноводія при собі встановлених правилами суднових документів і документів на право керування судном, на не зареєстрованому судні (у разі обов'язкової реєстрації), без відповідних бортових номерних знаків;","при видимості менше 500 м, при гідрометеорологічних умовах, що перевищують встановлені норми, для даного судна."],"correct":[0,1,2],"status":"ambiguous-source","note":"Усі три наведені умови є підставами, за яких вихід у плавання заборонено. У старіших навчальних матеріалах відповіддю було «усі варіанти вірні».","needsImage":false,"scorable":false},{"id":278,"sourceNumber":276,"text":"Які додаткові заходи повинні бути зроблені під час перевезення дітей?","options":["діти повинні бути одягнені в дитячі індивідуальні рятувальні засоби, діти від 7 до 10 років повинні бути з супроводжуючими їх дорослими людьми (по одному на кожного), перевезення дітей віком до 7 років на прогулянкових/малих суднах заборонено;","діти повинні бути одягнені в дитячі індивідуальні рятувальні засоби, діти до 16 років повинні бути з супроводжуючими їх дорослими людьми (по одному на кожного);","діти повинні бути одягнені в дитячі індивідуальні рятувальні засоби, діти до 10 років повинні бути з супроводжуючими їх дорослими людьми (по одному на кожного)."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":279,"sourceNumber":277,"text":"Якщо зустріч у вузькому проході стає неминучою та судноводій помічає небезпеку зіткнення, судно повинне подати:","options":["серію дуже коротких сигналів, що складаються не менш ніж з чотирьох звуків - \"Безпосередня небезпека зіткнення\". Звукові сигнали транспортних суден повинні супроводжуватися синхронно світловими сигналами, що мають жовтий колір і сектор освітлення 360°, як вдень, так і вночі;","серію дуже коротких сигналів, що складаються не менш ніж з п'яти звуків - \"Безпосередня небезпека зіткнення\". Звукові сигнали транспортних суден повинні супроводжуватися синхронно світловими сигналами, що мають жовтий колір і сектор освітлення 360°, як вдень, так і вночі;","серію дуже коротких сигналів, що складаються не менш ніж з шести звуків - \"Безпосередня небезпека зіткнення\". Звукові сигнали транспортних суден повинні супроводжуватися синхронно світловими сигналами, що мають жовтий колір і сектор освітлення 360°, як вдень, так і вночі."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":280,"sourceNumber":278,"text":"Як судна повинні проходити через вузькі проходи?","options":["усі судна повинні проходити вузький прохід в мінімальний термін. Судно що йде зверху повинно безперешкодно пропустити зустрічне судно. Коли зустріч у вузькому проході стає неминучою, обидва судна повинні вжити всіх можливих дії, щоб пропуск відбувся в місці і умовах, які б забезпечили безпечний пропуск цих суден;","усі судна повинні проходити вузький прохід в мінімальний термін. Судно що йде знизу повинно безперешкодно пропустити зустрічне судно. Коли зустріч у вузькому проході стає неминучою, обидва судна повинні вжити всіх можливих дії, щоб пропуск відбувся в місці і умовах, які б забезпечили безпечний пропуск цих суден;","усі судна повинні проходити вузький прохід в мінімальний термін. Судно що йде знизу повинно за 300 м до вузького місця стати на якір та пропустити зустрічне судно. Коли зустріч у вузькому проході стає неминучою, обидва судна повинні вжити всіх можливих дії, щоб пропуск відбувся в місці і умовах, які б забезпечили безпечний пропуск цих суден."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":281,"sourceNumber":279,"text":"При якій видимості прогулянковому/малому судну забороняється виходити на судовий хід?","options":["менш 1000 м;","менш 800 м;","менш 500 м."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":282,"sourceNumber":280,"text":"Який сигнал подають судна, що йдуть вверх і звільняють шлях суднам, що йдуть униз із правого борту?","options":["повинні завчасно подати світло імпульсний сигнал (відмашку) з правого борту;","повинні завчасно подати відмашку синім прапором з правого борт;","повинні завчасно подати відмашку червоним прапором з правого борту."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":283,"sourceNumber":281,"text":"Що означає сигнал \"три коротких звуки\", який подає судно?","options":["судно йде заднім ходом;","судно зупиняється;","судно швартується."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":284,"sourceNumber":282,"text":"На яку відстань забороняється підпливати гідроцикли до пляжів і іншим організованим місцях купання?","options":["ближче ніж 50 метрів від буйків огородження;","ближче ніж 10 метрів від буйків огородження;","ближче ніж 25 метрів від буйків огородження."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":285,"sourceNumber":283,"text":"Що таке зустрічне плавання?","options":["рух судна за течією;","рух двох суден, що йдуть назустріч один одному;","рух двох суден у протилежних чи майже в протилежних напрямках."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":286,"sourceNumber":284,"text":"Які основні суднові документи повинні бути на прогулянковому/малому судні?","options":["судновий білет, свідоцтво про придатність судна до плавання, дозвіл на право користування судновою радіостанцією;","судновий білет, свідоцтво про придатність судна до плавання, свідоцтво про право власності на судно;","судновий білет, свідоцтво про придатність судна до плавання."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":287,"sourceNumber":285,"text":"Яке судно несе даний сигнал: чорна куля на видному місці?","options":["судно вдень при стоянці на якорі;","судно, що здійснює промисловий лов;","судно, на якому виконуються водолазні роботи, вдень."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":288,"sourceNumber":286,"text":"При здійсненні повороту ліворуч або маневру, які сигнали подаються судном?","options":["один тривалий звук та один короткий звук;","один тривалий звук та два коротких звук;","два тривалих звука та два коротких звука."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":289,"sourceNumber":287,"text":"Державний нагляд за безпекою на морському та річковому транспорті?","options":["Адміністрація судноплавства;","Державне підприємство \"Класифікаційне товариство \"Регістр судноплавства України\";","Національна поліція України."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":290,"sourceNumber":288,"text":"В яких місцях дозволяється пересікати фарватер прогулянковим/малим суднам в межах міст?","options":["тільки в встановлених місцях, в денний час, при видимості не менше 1000 м і в найкоротший термін;","в будь якому місці суднового ходу, при видимості не менше 500 м і в найкоротший термін;","тільки в встановлених місцях, в денний час, при видимості не менше 500 м і в найкоротший термін."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":291,"sourceNumber":289,"text":"Які дії судна, яке поступається шляхом?","options":["судно, яке має у себе інше судно з лівого боку, має своєчасно поступитися йому дорогу. Однак це інше судно, коли для нього стає очевидним, що судно, зобов'язане дати дорогу, не робить відповідного дії, необхідного цими Правилами, може почати дію, щоб уникнути зіткнення тільки власним маневром;","кожне судно, яке зобов'язане дати дорогу іншому судну, повинно, наскільки це можливо, зробити завчасне і рішуча дія з тим, щоб \"чисто\" розійтися з іншим судном;","судно, яке має у себе інше судно з правого боку, має своєчасно поступитися йому дорогу. Однак це інше судно, коли для нього стає очевидним, що судно, зобов'язане дати дорогу, не робить відповідного дії, необхідного цими Правилами, може почати дію, щоб уникнути зіткнення тільки власним маневром."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":292,"sourceNumber":290,"text":"В денний час доби, судноводій прогулянкового/малого судна бачить судно, яке на видному місці несе знак, що складається з квадратного прапора з кулею, що знаходиться під ним. Що це означає?","options":["судно на якорі;","судно, зайняте днопоглиблювальними роботами;","судно, яке терпить лихо та потребує допомоги."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":293,"sourceNumber":291,"text":"На якій відстані від границі суднового ходу забороняється прогулянковому/малому судну знаходитись на якорі?","options":["ближче 15 метрів;","ближче 25 метрів;","ближче 10 метрів."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":294,"sourceNumber":292,"text":"Якщо виникає загроза зіткнення між вітрильним та моторним судном, хто повинен надати перевагу?","options":["вітрильне судно повинно дати дорогу моторному судну;","судно, що бачить інше судно по правому борту, повинне дати йому дорогу і, якщо дозволяють обставини, уникнути перетинання його курсу попереду;","моторне судно повинно дати дорогу вітрильному судну."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":295,"sourceNumber":293,"text":"Який знак має прогулянкове/мале судно, що йде під вітрилом і в той же час може рухатися за допомогою мотору?","options":["червоний конус вершиною вверх;","чорний конус вершиною вниз;","чорний конус вершиною вверх."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":296,"sourceNumber":294,"text":"Що означає сигнал, піднятий на судні: дві чорних кулі, розміщені по вертикалі?","options":["цей сигнал підіймається в день судном, яке виконує маневр;","цей сигнал підіймається в день судном безпосередньо перед маневром;","цей сигнал підіймається в день судном, в якого відсутня можливість маневру."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":297,"sourceNumber":295,"text":"Якою повинна бути швидкість прогулянкових/малих суден в місцях масового відпочинку людей з буйковим огородженням?","options":["уздовж пляжів дозволяється рух тільки за межами буйкового огородження і зі швидкістю 5 км/год;","уздовж пляжів дозволяється рух тільки за межами буйкового огородження і зі швидкістю 10 км/год;","уздовж пляжів дозволяється рух тільки за межами буйкового огородження і зі швидкістю 15 км/год."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":298,"sourceNumber":296,"text":"В яких місцях на річці прогулянковим/малим суднам дозволяється перетинати судновий хід?","options":["на річці перетинати фарватер судна можуть в межах міст тільки у встановлених місцях, а за межами - в будь-якому місці;","на річці перетинати фарватер судна можуть в межах міст тільки напроти баз стоянок, рухаючись курсом перпендикулярним фарватеру;","на річці перетинати фарватер судна можуть в межах міст тільки напроти баз стоянок, коли судноводії впевнений що маневр буде здійснений безпечно."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":299,"sourceNumber":297,"text":"Які дії зобов'язаний виконати судноводій на вимогу осіб, що контролюють безпеку руху?","options":["продовжити рух судна у разі впевненості в дотриманні правил руху;","зобов'язаний зменшити швидкість руху;","зобов'язаний зупинити судно та виконати законні вимоги осіб, що контролюють безпеку руху."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":300,"sourceNumber":298,"text":"З якою швидкістю дозволяється підходити та рухатися прогулянковому/малому судну, у місцях масового відпочинку людей необладнаних буями?","options":["залежно від вимог місцевих Правил плавання для маломірних суден;","зазначеним суднам забороняється підходити та рухатися у місцях масового відпочинку людей необладнаних буями;","не більше ніж 10 км/год."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":301,"sourceNumber":299,"text":"Чи входить в зобов'язання судноводіїв надавати у розпорядження контролюючих органів своє судно?","options":["медичному персоналу для транспортування хворого;","посадовим особам у випадках виконання невідкладних завдань для забезпечення безпеки судноплавства;","так, але за умов передбачених чинним законодавством."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":302,"sourceNumber":300,"text":"За яких умов дозволяється вихід прогулянкових/малих суден у плавання?","options":["технічної справності судна та наявності відповідного спорядження, погодних умов, які не обмежують експлуатацію судна, та видимості не менш 500 метрів,","технічної справності судна, погодних умов, які не обмежують експлуатацію судна, та видимості не менш 1000 метрів, наявності у судноводія свідоцтва на право керування маломірним судном;","технічної справності судна та наявності відповідного спорядження, погодних умов, які не обмежують експлуатацію судна, та видимості не менш 300 метрів,"],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":303,"sourceNumber":301,"text":"Чи можуть вітрильні судна користуватися водними об'єктами в період закритої навігації?","options":["можуть за умови сприятливих погодних умов;","не можуть користуватися;","можуть за умови віддаленості від найближчого берега не більше ніж 500 метрів."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":304,"sourceNumber":302,"text":"Чи дозволяється встановлювати на вітрильному судні додаткові кругові червоний та зелений сигнально-розпізнавальні ліхтарі?","options":["не дозволяється;","дозволяється тільки з дозволу Регістру судноплавства України;","дозволяється."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":305,"sourceNumber":303,"text":"Який сигнально-розпізнавальний ліхтар має бути на кормі вітрильному судні?","options":["один жовтий вогонь з сектором освіщеності 135 градусів;","один білий вогонь з сектором освіщеності 225 градусів;","один білий вогонь з сектором освіщеності 135 градусів."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":306,"sourceNumber":304,"text":"Які типи сигнально-розпізнавальних ліхтарів використовуються на вітрильному судні?","options":["бортові та топові вогні;","бортові та стояночні вогні;","бортові та кормовий вогні."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":307,"sourceNumber":305,"text":"Яке з перерахованих нижче дій водія не входить в число обов'язкових при контрольному огляді гідроциклу перед пуском двигуна?","options":["перевірка наявності документів на борту;","перевірка кріплення шнура безпеки;","перевірка рівня палива та масла."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":308,"sourceNumber":306,"text":"Яке адміністративне покарання передбачається за недотримання особою, керуючим маломірним судном, встановленої швидкості?","options":["попередження або штраф від трьох до п'яти неоподаткованих мінімумів доходів громадян або позбавлення права керування маломірним судном на строк до одного року;","штраф від одного до п'яти неоподаткованих мінімумів доходів громадян або позбавлення права керування маломірним судном на строк до одного року;","попередження або штраф від трьох до п'яти неоподаткованих мінімумів доходів громадян."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":309,"sourceNumber":307,"text":"Чи можна використовувати гідроцикл в темний час доби?","options":["не можна;","можна, за умови пересування мінімальною швидкістю;","можна, за умови несення навігаційних вогнів."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":310,"sourceNumber":308,"text":"Хто допускається до управління гідроциклами і іншими судами, що пройшли державну реєстрацію?","options":["будь-які особи не молодше 18 років;","особи не молодше 18 років, які мають Посвідчення судноводія маломірного судна відповідної категорії та дозволеного району плавання;","особи не молодше 18 років, які мають досвід керування гідроциклами та іншими суднами."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":311,"sourceNumber":309,"text":"Де має слідувати маломірне судно (в т. ч. гідроцикл) по судновому ходу, якщо немає можливості слідувати по кромці або за кромкою суднового ходу?","options":["по судновому ходу в межах 25 метрової полоси від кромки суднового ходу;","по судновому ходу в межах 10 метрової полоси від кромки суднового ходу;","будь-де по судновому ходу за умов відсутності інших суден."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":312,"sourceNumber":310,"text":"За яких умов можна на гідроциклі перевозити дітей дошкільного віку?","options":["за умов супроводу дорослих та одягнуті в рятувальні жилети;","за умов проведення інструктажу з безпеки та одягнуті в рятувальні жилети;","за умов наявності рятувальних жилетів на борту гідроциклу та супроводу дорослих."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":313,"sourceNumber":311,"text":"Використання гідроциклів дозволяється?","options":["у світлий час доби та при видимість не менше 1000 метрів;","у світлий час доби та за умови сприятливих погодних умов;","будь-коли за умови дотримання обмежень судна, призначених Регістром судноплавства України."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":314,"sourceNumber":312,"text":"Що забороняється гідроциклам при плаванні по внутрішнім водним шляхах?","options":["виходити у плавання без реєстраційних документів та свідоцтва судноводія маломірного судна;","перевозити вибухонебезпечні та легкозаймисті вантажі;","обидві відповіді вірні."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":315,"sourceNumber":313,"text":"Які відомості мають бути вказані на борту гідроциклу?","options":["номер державної реєстрації;","назва виробника та потужність двигуна;","номер Державної реєстрації або назва судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":316,"sourceNumber":314,"text":"В якому з наступних випадків не дозволяється користуватися гідроциклом?","options":["обидві відповіді вірні;","судноводій не має посвідчення на право керування маломірним судном відповідної категорії;","судно не зареєстроване у встановленому порядку."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":317,"sourceNumber":315,"text":"За якої видимості можливе використання гідроциклу?","options":["не менш як 500 метрів;","не менш як 1000 метрів;","не менш як 200 метрів."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":318,"sourceNumber":316,"text":"Чи дозволяється підхід водних мотоциклів до берега, місцях масового відпочинку громадян?","options":["підхід гідроциклів до берега в місцях масового відпочинку громадян дозволено за умови впевненості судноводія в безпечності руху;","підхід гідроциклів до берега в місцях масового відпочинку громадян дозволено у випадку наявності спеціально відведеного та огородженого фарватеру;","підхід гідроциклів до берега в місцях масового відпочинку громадян заборонено у будь-яких випадках."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":319,"sourceNumber":317,"text":"Порядок посадки та висадки пасажирів на гідроциклі:","options":["порядок посадки (висадки) пасажирів визначається в залежності від навігаційній обстановки;","порядок посадки (висадки) пасажирів визначає особисто судноводій;","посадка (висадка) пасажирів повинна відбуватися у обладнаного для цих цілей причалу (берега) при непрацюючому двигуні. Контроль за безпекою посадки (висадки) людей повинен здійснювати особисто судноводій. Судноводій повинен провести інструктаж про правила поведінки на судні і перевірити чи правильно одягнені рятувальні жилети."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":320,"sourceNumber":318,"text":"Скільки спортсменів воднолижників одночасно може буксирувати гідроцикл?","options":["не більше трьох;","не більше одного;","не більше двох."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":321,"sourceNumber":319,"text":"У яких з нижче перерахованих випадків забороняється запускати двигун і починати рух гідроциклу?","options":["пасажири та судноводій не вдягли рятувальні жилети;","судноводій не впевнився в справності гідроциклу;","обидві відповіді вірні."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":322,"sourceNumber":320,"text":"Ким здійснюється випуск прогулянкового/малого судну територіальне море, внутрішні води України на відстань до 2 (двох) морських миль?","options":["прикордонною службою;","Адміністрацією причалу, пристані, пункту базування суден, тобто місця, де прогулянкове/мале судну стало на тимчасовий облік по прибуттю в прикордонну смугу або контрольований прикордонний район;","Державною службою морського і внутрішнього водного транспорту та судноплавства України."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":323,"sourceNumber":321,"text":"У яких випадках встановлюється обмеження руху суден на акваторії бази стоянки?","options":["у випадках несприятливих погодних умов випускний режим бази стоянки повинен встановити обмеження швидкості руху прогулянковому/малому судні по акваторії бази стоянки;","у всіх випадках випускний режим бази стоянки не повинен встановити обмеження швидкості руху прогулянковому/малому судні по акваторії бази стоянки;","у всіх випадках випускний режим бази стоянки повинен встановити обмеження швидкості руху прогулянковому/малому судні по акваторії бази стоянки."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":324,"sourceNumber":322,"text":"Хто встановлює терміни щорічного відкриття та закриття навігації для прогулянкових/малих суден?","options":["територіальний структурний підрозділ Адміністрації судноплавства за узгодженням з місцевою державною адміністрацією;","Адміністрація судноплавства за погодження з місцевою державною адміністрацією;","Голова Облради за поданням Облдержадміністрації узгодженого з начальником територіального структурного підрозділу Адміністрації судноплавства."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":325,"sourceNumber":323,"text":"Якими конструктивними елементами забезпечується загальна поздовжня міцність корпусу?","options":["основним поздовжнім елементом є носовий шпрінг. Інші поздовжні елементи називаються стрингерами. Днищеві стрингери називаються кільсонами, підпалубні - карлингсами;","основним поздовжнім елементом є кіль. Інші поздовжні елементи називаються стрингерами. Днищеві стрингери називаються кільсонами, підпалубні - карлингсами;","основним поздовжнім елементом є форштевень. Інші поздовжні елементи називаються стрингерами. Днищеві стрингери називаються кільсонами, підпалубні - карлингсами."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":326,"sourceNumber":324,"text":"Як називається плоскість, яка проходить посередині корпуси судна і ділить його на дві симетричні частини?","options":["діаметральною площиною;","лінія міделя;","діаметральною шириною."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":327,"sourceNumber":325,"text":"Як називається вертикальна плоскість, яка проходить посередині судна і розташована перпендикулярно діаметральній плоскості?","options":["діаметральною площиною;","площиною мідель-шпангоута;","діаметральною шириною."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":328,"sourceNumber":326,"text":"Як називається горизонтальна плоскість, яка проходить по всій довжині судна і співпадаюча з поверхнею спокійної води?","options":["діаметральною площиною;","шириною ватерлінії;","площиною ватерлінії."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":329,"sourceNumber":327,"text":"До якої системи набору корпусу судна відносяться наступні балки: кіль, стрингери, карлінгси, ребра жорсткості?","options":["до поздовжньої системи набору корпусу;","до поперечної системи набору корпусу;","до вертикальної системи набору корпусу."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":330,"sourceNumber":328,"text":"До якої системи набору корпусу судна відносяться наступні балки: флори, шпангоути, бімси?","options":["до поперечної системи набору корпусу;","до горизонтальної системи набору корпусу;","до поздовжньої системи набору корпусу."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":331,"sourceNumber":330,"text":"Чим забезпечується непотоплюваність судна?","options":["конструкцією корпусу, наявністю поздовжніх і поперечних водонепроникних перегородок, наявністю необхідного аварійно-рятувального постачання і обладнання, вмінням екіпажу везти боротьбу за живучість свого судна;","наявністю необхідного аварійно-рятувального постачання і обладнання, вмінням екіпажу везти боротьбу за живучість свого судна;","конструкцією корпусу, наявністю поздовжніх і поперечних водонепроникних перегородок."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":332,"sourceNumber":331,"text":"Чим забезпечується аварійний запас плавучості у прогулянкових/малих суден?","options":["не затоплені об'єкти корпусу судна - це блоки із пінопласту, плаваючих елементів корпусу - пінопластового привального брусу;","пінопластового привального брусу;","плаваючих матеріалів виготовлення корпусу."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":333,"sourceNumber":332,"text":"Що називається транцем на прогулянковому/малому судні?","options":["в частині лівого борту, замість ахтерштевня, встановлюється стінка, яка називається транцем або трацевою дошкою, для кріплення стаціонарних двигунів;","в кормовій частині, замість ахтерштевня, встановлюється стінка, яка називається транцем або трацевою дошкою, для кріплення підвісних двигунів;","замість ахтерштевня встановлюється плоска вертикальна стінка, яка називається транцем (транцевой дошкою) і призначена для кріплення стаціонарних моторів."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":334,"sourceNumber":333,"text":"Як називається подовжня головна балка донного набору корпусу судна?","options":["форштевень;","ахтерштевень;","кіль."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":335,"sourceNumber":334,"text":"Що таке форштевень?","options":["міцна балка в носовій частині кіля, загинається догори і служить для з'єднання поздовжніх зв'язків судна і обшивки в носовій частині судна;","міцна балка в кормовій частині кіля, загинається догори і служить для з'єднання поздовжніх зв'язків судна і обшивки в кормовій частині судна;","міцна балка в носовій частині кіля, загинається догори і служить для поліпшення плавучості зв'язків судна і обшивки в носовій частині судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":336,"sourceNumber":335,"text":"Корпус якого судна вважається з поперечним набором?","options":["судно вважається з поперечним набором корпусу тоді, коли відстань між балками поперечного напрямку, яке називається шпаціями, більше ніж між поздовжніми;","судно вважається з поперечним набором корпусу тоді, коли відстань між балками поперечного напрямку, яке називається шпаціями, менше ніж між поздовжніми;","судно вважається з поперечним набором корпусу тоді, коли відстань між балками поперечного напрямку, яке називається шпаціями, дорівнює відстані поздовжнього напрямку."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":337,"sourceNumber":336,"text":"Що таке ахтерштевень?","options":["міцна балка в кормовій частині кіля, загинається до верху;","міцна балка в носовій частині кіля, загинається до низу;","міцна балка в кормовій частині кіля, загинається до низу."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":338,"sourceNumber":337,"text":"З якою метою на прогулянковому/малому судні встановлюються блоки з пінопласту?","options":["з метою підвищення запасу стійкості;","з метою підвищення запасу плавучості;","з метою використання замість рятувальних кругів."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":339,"sourceNumber":338,"text":"Ширина міжбортового простору повинна становити?","options":["1,4 метрів;","1,3 метрів;","1,5 метрів."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":340,"sourceNumber":339,"text":"Висота комінгсів дверей і вхідних люків машинного відділення повинні завжди становити не менше?","options":["0,5 метрів;","0,3 метрів;","0,2 метрів."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":341,"sourceNumber":340,"text":"Як називається бортова частина балки поперечного набору корпусу судна?","options":["шпангоут;","форштевень;","карлінгс."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":342,"sourceNumber":341,"text":"Як називається кормова поперечна перегородка, яка на прогулянковому/малому судні служить для установки підвісного двигуна?","options":["транц;","форштевень;","карлінгс."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":343,"sourceNumber":342,"text":"Чи дозволяється на гребному човні встановлювати двигун?","options":["так, але не більше ніж 3,5 к.с.;","ні;","так, але не більше ніж 7 к.с."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":344,"sourceNumber":343,"text":"Як називається огорожа, що складається з вертикальних стійок, з'єднаних між собою ланцюгами, тросами або круглими прутами?","options":["леєрне огородження;","обмежувальне огородження;","бортове огородження."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":345,"sourceNumber":344,"text":"Як називається вертикальна носова балка, що є продовженням кіля?","options":["транець,","полубімс;","форштевень."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":346,"sourceNumber":345,"text":"До яких головних розмірів судна відноситься відстань, виміряна в плоскості мідель шпангоуту по вертикалі від кіля до верхньої палуби?","options":["висотою борту і відноситься до Головних розмірам судна;","шириною борту і відноситься до Головних розмірам судна;","довжиною борту і відноситься до Головних розмірам судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":347,"sourceNumber":346,"text":"Яким способом здійснити перевірку на водонепроникність люкових зачинень?","options":["шляхом обстеження їх уповноваженої комісії;","шляхом обприскування їх водою;","шляхом їх візуального обстеження."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":348,"sourceNumber":347,"text":"Конструктивне забезпечення непотоплюваності гідроциклу?","options":["корпус гідроциклу закритого типу;","водонепроникні переборки корпусу;","матеріал корпусу гідроциклу."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":349,"sourceNumber":348,"text":"Що називається остійністю?","options":["здатність судна плавати, несучи всі призначені вантажі і маючи при цьому задану осадку носом і кормою;","здатність судна плавати в прямому положенні, відхилятися від цього положення під дією зовнішньої сили і повертатися в таке після припинення дії цієї сили;","здатність судна плавати в прямому положенні, не відхиляючись від цього положення під дією зовнішньої сили."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":350,"sourceNumber":350,"text":"Що називають повороткістю?","options":["здатність судна змінювати напрямок свого руху під час перекладання керма в ту або іншу сторону;","здатність судна утримувати напрямок свого руху під час перекладання керма в ту або іншу сторону;","здатність судна виконувати \"оверкіль\"."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":351,"sourceNumber":351,"text":"Що називають креном?","options":["занурення понад норму кормової частини судна;","кут між вертикальною площиною і діаметральною площиною судна;","занурення понад норму носової частини судна."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":352,"sourceNumber":352,"text":"Що називають плавучістю?","options":["здатність судна плавати, несучи всі призначені вантажі, команду, пасажирів;","здатність судна плавати, несучи всі призначені вантажі і маючи при цьому задану осадку носом і кормою;","здатність судна плавати, несучи всі призначені вантажі, команду, пасажирів, маючи при цьому задану осадку носом і кормою."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":353,"sourceNumber":353,"text":"У яких відповідях перераховані всі можливі сили, що діють на корпус судна?","options":["на корпус судна діє вага судна і тиск води на занурену частину корпусу сили опору води;","на корпус судна діють, як постійні (статистичні сили) такі як вага судна і тиск води на занурену частину корпусу - сили підтримки, так і тимчасові сили, до них слід віднести сили, які з'являються при хитавиці судна на схвильованої поверхні води, сили інерції маси судна і сили опору води;","на корпус судна діють тимчасові сили, до них слід віднести сили, які з'являються при хитавиці судна на схвильованої поверхні води, сили інерції маси судна і сили опору води."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":354,"sourceNumber":354,"text":"Для чого призначеній рульовій пристрій судна?","options":["для забезпечення повороткості судна;","для забезпечення стійкості судна;","для забезпечення надійною стоянки судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":355,"sourceNumber":355,"text":"Для чого призначений якірний пристрій судна?","options":["для забезпечення надійною якірної стоянки судна в різних умовах експлуатації;","для забезпечення надійного ходу судна в різних умовах експлуатації;","для забезпечення надійною стійкості судна в різних умовах експлуатації."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":356,"sourceNumber":356,"text":"Для виконання яких функцій призначений швартовий пристрій судна?","options":["для надійною швартової стоянки судна в різних умовах експлуатації;","для підтягування судна до берегових і плавучих причальних споруд і надійного кріплення судна до них;","для відштовхування судна від берегових і плавучих причальних споруд."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":357,"sourceNumber":357,"text":"Яке призначення осушної системи судна?","options":["постачання до корпусу невеликих мас води;","видалення з корпусу великих мас води;","видалення з корпусу невеликих мас води."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":358,"sourceNumber":358,"text":"При яких з перерахованих умов судно буде \"Остійним\"?","options":["судно буде вважатися остійним тоді, коли метанцетрична висота (міра поперечної статичної остійності) - відстань між метацентром і центром тяжіння судна - буде відповідати потребам \"Інформації об остійності судна\" для даного варіанта завантаження судна. На поперечну остійність судна великий вплив робить довжина корпусу: чим довше корпус, тим судно більш остійне, та, навпаки, чим корпус коротше та вище, тим остійність буде гірше. Остійність судна залежить від завантаження судна, переміщення вантажів, пасажирів і від інших причин. Чим більше метацентрична висота, тим більше відновлювальний момент і остійність судна, однак при великій остійності судно має різку хитавицю. Покращує остійність високе розташування двигуна, паливного бака, сидінь і відповідного розміщення вантажів і людей;","судно буде вважатися остійним тоді, коли метанцетрична висота (міра поперечної статичної остійності) - відстань між метацентром і центром тяжіння судна - буде відповідати потребам \"Інформації об остійності судна\" для даного варіанта завантаження судна. На поперечну остійність судна великий вплив робить ширина корпусу: чим ширше корпус, тим судно більш остійне, та, навпаки, чим корпус вуже та вище, тим остійність буде гірше. Остійність судна залежить від завантаження судна, переміщення вантажів, пасажирів і від інших причин. Чим більше метацентрична висота, тим більше відновлювальний момент і остійність судна, однак при великій остійності судно має різку хитавицю. Покращує остійність низьке розташування двигуна, паливного бака, сидінь і відповідного розміщення вантажів і людей;","судно буде вважатися остійним тоді, коли метанцетрична низина (міра поперечної статичної остійності) - відстань між метацентром і центром тяжіння судна - буде відповідати потребам \"Інформації об остійності судна\" для даного варіанта завантаження судна. На поперечну остійність судна великий вплив робить ширина корпусу: чим ширше корпус, тим судно більш остійне, та, навпаки, чим корпус вуже та вище, тим остійність буде гірше. Остійність судна залежить від завантаження судна, переміщення вантажів, пасажирів і від інших причин. Чим більше метацентрична низина, тим більше відновлювальний момент і остійність судна, однак при великій остійності судно має різку хитавицю. Покращує остійність високе розташування двигуна, паливного бака, сидінь і відповідного розміщення вантажів і людей."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":359,"sourceNumber":359,"text":"Посадка судна, це положення судна відносно поверхні спокійної води. Чим вона визначається?","options":["розрізняють такі види посадки: посадка по мідельшпангоуту - відстань від ватерлінії до зовнішньої кромці обшивки кіля; посадка носом, вимірювана по носовій точці занурення, або у носовій марки; посадка кормою, вимірювана по кормової точки занурення, або у кормовій марки; посадка по ватерлінії - горизонтальна плоскість, яка проходить по всій довжині судна і співпадаюча з поверхнею спокійної води;","розрізняють такі види посадки: диферент - нахил судна відбувається в поздовжній площині; посадка носом, вимірювана по носовій точці занурення, або у носовій марки; посадка кормою, вимірювана по кормової точки занурення, або у кормовій марки; середня посадка - середнє арифметичне значення носової і кормової посадки. Для вимірювання посадки на корпусі судна наносяться марки поглиблення. Марки поглиблення наносяться по вертикалі від кінцевих точок прямої лінії кіля до головної ватерлінії з обох бортів судна;","розрізняють такі види посадки: посадка по мідельшпангоуту - відстань від ватерлінії до зовнішньої кромці обшивки кіля; посадка носом, вимірювана по носовій точці занурення, або у носовій марки; посадка кормою, вимірювана по кормової точки занурення, або у кормовій марки; середня посадка - середнє арифметичне значення носової і кормової посадки. Для вимірювання посадки на корпусі судна наносяться марки поглиблення. Марки поглиблення наносяться по вертикалі від кінцевих точок прямої лінії кіля до головної ватерлінії з обох бортів судна."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":360,"sourceNumber":360,"text":"Плавучість судна характеризується запасом плавучості, в чому він виражається?","options":["запас плавучості безпосередньо пов'язаний з висотою підводного борту: чим вона нижче, тим більше запас плавучості. Запас плавучості визначає кількість води, надходження якої при аварії витримує судно до повного занурення, тому є найважливішою характеристикою його непотоплюваності. Висоту надводного борту судна приймають в якості основного вимірника запасу плавучості. Запас плавучості - це мінімальна висота підводного борту, що допускається для забезпечення плавучості судна. Достатній запас плавучості досягається рядом конструктивних заходів, до числа яких відносяться: забезпечення достатньої висоти підводного борту, стійко водонепроникних закритих і поділ судна на відсіки міцними водонепроникними перегородками і палубами;","запас плавучості безпосередньо пов'язаний з висотою надводного борту: чим вона більша, тим більше запас плавучості. Запас плавучості визначає кількість води, надходження якої при аварії витримує судно до повного занурення, тому є найважливішою характеристикою його непотоплюваності. Висоту надводного борту судна приймають в якості основного вимірника запасу плавучості. Запас плавучості - це мінімальна висота надводного борту, що допускається для забезпечення плавучості судна. Достатній запас плавучості досягається рядом конструктивних заходів, до числа яких відносяться: забезпечення достатньої висоти надводного борту, стійко водонепроникних закритих і поділ судна на відсіки міцними водонепроникними перегородками і палубами;","запас плавучості безпосередньо пов'язаний з висотою надводного борту: чим вона більша, тим менше запас плавучості. Запас плавучості визначає кількість води, надходження якої при аварії витримує судно до повного занурення, тому є найважливішою характеристикою його непотоплюваності. Висоту надводного борту судна приймають в якості основного вимірника запасу плавучості. Запас плавучості - це мінімальна висота надводного борту, що допускається для забезпечення плавучості судна. Достатній запас плавучості досягається рядом конструктивних заходів, до числа яких відносяться: забезпечення достатньої висоти надводного борту, стійко водонепроникних закритих і поділ судна на відсіки міцними водонепроникними перегородками і палубами."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":361,"sourceNumber":361,"text":"Що називається креном?","options":["нахил на корму судна;","рівне розташування судна біля берега;","нахил судна на один або інший борт."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":362,"sourceNumber":362,"text":"Непотоплюваність судна це?","options":["здатність судна продовжувати плавати і зберігати свої морехідні якості після пошкодження адміралтейського якоря;","здатність судна плавати, несучи все призначені вантажі і маючи при цьому задану осадку носом і кормою;","здатність судна продовжувати плавати і зберігати свої морехідні якості після пошкодження одного  (затоплені споруди, оголовки дамб і ін.) та дублює кромковий знак на правій кромці суднового ходу."],"correct":[1],"status":"verified","note":"У вихідному DOCX зображення для цього питання відсутнє.","needsImage":true,"scorable":false},{"id":415,"sourceNumber":415,"text":"Знак на малюнку, що означає \"УВАГА\", знаходиться під літерою?","options":["під літерою \"в\";","під літерою \"а\";","під літерою \"б\"."],"correct":[1],"status":"verified","note":"У вихідному DOCX зображення для цього питання відсутнє.","needsImage":true,"scorable":false},{"id":416,"sourceNumber":416,"text":"Що означає даний знак?","options":["\"Розходження і обгін составів заборонені!\". Даний знак позначає ділянку судноплавного шляху, де забороняється обгін і розбіжність складів і великогабаритних суден довжиною понад 120 м;","даний знак позначає ділянку судноплавного шляху, де забороняється обгін і розбіжність маломірних суден;","даний знак позначає ділянку судноплавного шляху, де забороняється обгін і розбіжність складів і великогабаритних суден довжиною понад 100 м."],"correct":[0],"status":"verified","note":"У вихідному DOCX зображення для цього питання відсутнє.","needsImage":true,"scorable":false},{"id":417,"sourceNumber":417,"text":"Що означає даний знак?","options":["\"Якір не кидати\". Даний знак позначає зону підводного переходу на ділянці судноплавного шляху, де заборонено: стояти на якорі, віддавати якоря, опускати ланцюги, волокуші, лоти. Заборона поширюється тільки на бік шляху, на якому розміщений цей знак;","\"Якір не кидати\". Даний знак позначає зону підводного переходу на ділянці судноплавного шляху, де заборонено: стояти на якорі, віддавати якоря. Заборона поширюється тільки на бік шляху, на якому розміщений цей знак;","\"Якір не кидати\". Даний знак позначає зону підводного переходу на ділянці судноплавного шляху, де заборонено: стояти на якорі, віддавати якоря, опускати ланцюги, волокуші, лоти. Заборона поширюється на всю ділянку суднового шляху, на якому розміщений цей з
