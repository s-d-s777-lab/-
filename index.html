го ходу в суднохідному прольоті моста\", \"Ходовий\", \"Зимовий\", \"Орієнтир\";","\"Створ осьової\", \"Створ щілинний\", \"Створ кромки\", \"Перевальний\", \"Знак небезпеки\", \"Покажчик довжини підмостового габариту та кромок суднового ходу в суднохідному прольоті моста\", \"Ходовий\", \"Зимовий\", \"Орієнтир\";","\"Створ осьової\", \"Створ щілинний\", \"Створ кромки\", \"Перевальний\", \"Покажчик осі суднового ходу в суднохідному прольоті моста\", \"Покажчик висоти підмостового габариту та кромок суднового ходу в суднохідному прольоті моста\", \"Ходовий\", \"Весняний\", \"Орієнтир\"."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":431,"sourceNumber":431,"text":"Що відноситься до плавучих засобів навігаційного обладнання?","options":["\"Поворотний\", \"Знак небезпеки\", \"Звальний знак\", \"Ходовий\", \"Осьовий\", \"Поворотне-осьовий\";","\"Кромковий\", \"Поворотний\", \"Знак небезпеки\", \"Звальний знак\", \"Розділовий\", \"Осьовий\", \"Поворотне-осьовий\";","\"Кромковий\", \"Поворотний\", \"Знак небезпеки\", \"Звальний знак\", \"Розділовий\", \"Ходовий\", \"Поворотне-осьовий\"."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":432,"sourceNumber":432,"text":"Яке основне призначення кардинальних знаків системи МАМС?","options":["кардинальні знаки показують з якого боку обходять огороджувальну небезпеку щодо берегів;","кардинальні знаки показують з якого боку обходять огороджувальну небезпеку щодо суднового ходу;","кардинальні знаки показують з якого боку обходять огороджувальну небезпеку щодо сторін світу."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":433,"sourceNumber":433,"text":"Для чого використовуються в системі МАМС знаки спеціального призначення?","options":["знаки спеціального призначення застосовується для позначення або огорожі сторін перевалу;","знаки спеціального призначення застосовується для позначення або огородження спеціальних районів або об'єктів;","знаки спеціального призначення застосовується для позначення або огородження сторін бару."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":434,"sourceNumber":434,"text":"Для чого використовуються осьові знаки системи МАМС?","options":["осьові знаки позначають початкової точки і вісь фарватеру (каналу) і середину проходу;","осьові знаки позначають вісь фарватеру (каналу) і початкової точки мілині;","осьові знаки позначають середини фарватеру і початкової точки мілині."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":435,"sourceNumber":435,"text":"Для чого використовуються в системі МАМС латеральні знаки?","options":["латеральні знаки виставляються за принципом огородження сторін фарватеру;","латеральні знаки виставляються за принципом огородження сторін перешкоди;","латеральні знаки виставляються за принципом огородження сторін річкового бару."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true}];</script><script>(() => {
  const Q = window.QUESTIONS || [];
  const $ = (s) => document.querySelector(s);
  const app = $('#app');
  const STORE = 'boatTestsSafari.v2';

  let state = load();
  let tab = 'test';
  let currentId = findResumeId();
  let summaryBlock = null;
  let searchTerm = '';

  function load() {
    try {
      const x = JSON.parse(localStorage.getItem(STORE));
      return x && x.answers ? x : { answers: {}, seen: {} };
    } catch (_) {
      return { answers: {}, seen: {} };
    }
  }

  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (_) {} }
  function qById(id) { return Q.find((q) => q.id === id); }
  function seen(q) { return !!state.seen[q.id]; }
  function selected(q) {
    const v = state.answers[q.id];
    return Number.isInteger(v) ? v : null;
  }
  function isCorrect(q, sel = selected(q)) { return sel !== null && q.correct.includes(sel); }
  function effectiveScorable(q) { return q.scorable === true; }
  function markSeen(q) { state.seen[q.id] = true; save(); }

  function stats() {
    let seenN = 0, answered = 0, correct = 0, wrong = 0, scored = 0;
    Q.forEach((q) => {
      if (seen(q)) seenN++;
      const s = selected(q);
      if (s !== null) {
        answered++;
        if (effectiveScorable(q)) {
          scored++;
          if (isCorrect(q, s)) correct++; else wrong++;
        }
      }
    });
    return { seenN, answered, correct, wrong, scored, pct: Q.length ? Math.round(seenN / Q.length * 100) : 0 };
  }

  function findResumeId() {
    const unseen = Q.find((q) => !state.seen?.[q.id]);
    return unseen ? unseen.id : Q.length;
  }
  function blockStart(id) { return Math.floor((id - 1) / 10) * 10 + 1; }
  function blockQuestions(start) { return Q.filter((q) => q.id >= start && q.id < start + 10); }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function header() {
    const st = stats();
    return `<div class="topbar"><div class="brand">Судноводій</div><div class="pill">${st.pct}% пройдено</div></div>`;
  }
  function progressBar() {
    const st = stats();
    return `<div class="progress-track"><div class="progress-fill" style="width:${st.pct}%"></div></div><div class="row between small muted"><span>${st.seenN} із ${Q.length}</span><span>${st.pct}%</span></div>`;
  }
  function statusBadge(q) {
    if (q.needsImage) return `<span class="badge">потрібне зображення</span>`;
    if (q.status === 'ambiguous-source') return `<span class="badge">не оцінюється</span>`;
    if (q.status === 'source-key-conflict') return `<span class="badge">є примітка</span>`;
    return '';
  }

  function showTab(name) {
    tab = name;
    document.querySelectorAll('.nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
    render();
  }

  function render() {
    if (tab === 'test') renderTest();
    else if (tab === 'all') renderAll();
    else if (tab === 'mistakes') renderMistakes();
    else renderStats();
  }

  function renderTest() {
    const st = stats();
    if (summaryBlock !== null) { renderSummary(summaryBlock); return; }

    if (st.seenN >= Q.length) {
      app.innerHTML = header() + `<div class="card hero"><h1>Усі питання пройдено</h1><p>Можеш переглянути помилки або почати заново.</p>${progressBar()}</div><div class="btnrow"><button class="btn" id="mist">Переглянути помилки</button><button class="btn secondary" id="allq">Усі питання</button></div>`;
      $('#mist').onclick = () => showTab('mistakes');
      $('#allq').onclick = () => showTab('all');
      return;
    }

    let q = qById(currentId);
    if (!q) {
      const u = Q.find((x) => !seen(x));
      if (u) { currentId = u.id; q = u; } else { render(); return; }
    }

    const start = blockStart(q.id);
    const arr = blockQuestions(start);
    const pos = q.id - start + 1;
    const sel = selected(q);
    const answered = seen(q);

    const opts = q.options.map((o, i) => {
      let cls = 'answer';
      if (answered) {
        if (q.correct.includes(i)) cls += ' correct';
        else if (sel === i) cls += ' wrong';
        else cls += ' dim';
      }
      return `<button class="${cls}" data-opt="${i}" ${answered ? 'disabled' : ''}><span class="letter">${String.fromCharCode(65 + i)}</span><span>${esc(o)}</span></button>`;
    }).join('');

    let warning = '';
    if (q.needsImage) {
      warning = `<div class="warning"><b>У вихідному DOCX немає самого зображення.</b><br>Питання залишене в переліку, але не враховується у відсоток правильних відповідей.</div>`;
    } else if (q.status === 'ambiguous-source') {
      warning = `<div class="warning"><b>У джерелі немає однозначного одного варіанта.</b><br>Це питання не враховується в оцінку.</div>`;
    }

    let fb = '';
    if (answered) {
      if (effectiveScorable(q)) {
        fb = `<div class="feedback"><b>${isCorrect(q) ? 'Правильно.' : 'Неправильно.'}</b>${q.note ? `<br>${esc(q.note)}` : ''}</div>`;
      } else {
        fb = `<div class="feedback"><b>Питання переглянуто.</b>${q.note ? `<br>${esc(q.note)}` : ''}</div>`;
      }
    }

    app.innerHTML = header() + `<div class="card"><div class="qmeta"><span>Блок ${Math.floor((start - 1) / 10) + 1} · ${pos}/${arr.length}</span><span>Питання ${q.id}/${Q.length}</span></div>${progressBar()}<div style="height:8px"></div><div class="row between"><span class="badge">№ у файлі: ${q.sourceNumber}</span>${statusBadge(q)}</div><div class="question">${esc(q.text)}</div>${warning}<div class="answers">${opts}</div>${fb}</div><div class="btnrow"><button class="btn ghost" id="skip" ${answered ? 'disabled' : ''}>${q.needsImage || q.status === 'ambiguous-source' ? 'Позначити переглянутим' : 'Пропустити'}</button><button class="btn" id="next" ${answered ? '' : 'disabled'}>${q.id === arr[arr.length - 1].id ? 'Результати 10' : 'Далі'}</button></div>`;

    document.querySelectorAll('[data-opt]').forEach((b) => { b.onclick = () => answer(q, Number(b.dataset.opt)); });
    $('#skip').onclick = () => { markSeen(q); advance(q); };
    $('#next').onclick = () => advance(q);
  }

  function answer(q, i) {
    if (seen(q)) return;
    state.answers[q.id] = i;
    markSeen(q);
    renderTest();
  }

  function advance(q) {
    const start = blockStart(q.id);
    const arr = blockQuestions(start);
    const last = arr[arr.length - 1].id;
    if (q.id >= last) {
      summaryBlock = start;
      renderTest();
      return;
    }
    let next = Q.find((x) => x.id > q.id && x.id <= last && !seen(x));
    if (!next) next = Q.find((x) => x.id > q.id && !seen(x));
    currentId = next ? next.id : Math.min(q.id + 1, Q.length);
    renderTest();
  }

  function renderSummary(start) {
    const arr = blockQuestions(start);
    let c = 0, w = 0, skip = 0;
    arr.forEach((q) => {
      const s = selected(q);
      if (!effectiveScorable(q) || s === null) { skip++; return; }
      if (isCorrect(q, s)) c++; else w++;
    });

    const items = arr.map((q) => {
      const s = selected(q);
      const badge = !effectiveScorable(q)
        ? '<span class="badge">не оцінюється</span>'
        : (s === null ? '<span class="badge">пропущено</span>' : (isCorrect(q, s) ? '<span class="badge good">правильно</span>' : '<span class="badge bad">помилка</span>'));
      const chosen = s === null ? '-' : q.options[s];
      const correct = q.correct.length ? q.correct.map((i) => q.options[i]).join(' / ') : 'У джерелі немає однозначного варіанта';
      return `<div class="summary-item"><div class="row between"><span class="small muted">Питання ${q.id}</span>${badge}</div><div class="summary-q">${esc(q.text)}</div><div class="mini-answer ${s !== null && effectiveScorable(q) && !isCorrect(q, s) ? 'bad' : ''}"><b>Твоя:</b> ${esc(chosen)}</div><div class="mini-answer good"><b>Правильна:</b> ${esc(correct)}</div>${q.note ? `<div class="small muted">${esc(q.note)}</div>` : ''}</div>`;
    }).join('');

    app.innerHTML = header() + `<div class="card hero"><div class="small muted">Блок ${Math.floor((start - 1) / 10) + 1}</div><h1>${c} правильних</h1><p>${w} помилок · ${skip} без оцінювання/пропущено</p></div><div class="card">${items}</div><button class="btn" id="nextblock">${start + 10 <= Q.length ? 'Наступні 10 питань' : 'Завершити'}</button>`;
    $('#nextblock').onclick = () => {
      summaryBlock = null;
      const n = Q.find((x) => x.id >= start + 10 && !seen(x)) || Q.find((x) => !seen(x));
      currentId = n ? n.id : Q.length;
      renderTest();
    };
  }

  function renderAll() {
    let filtered = Q;
    if (searchTerm.trim()) {
      const t = searchTerm.toLowerCase();
      filtered = Q.filter((q) => (q.text + ' ' + q.options.join(' ')).toLowerCase().includes(t));
    }
    const list = filtered.map((q) => `<div class="card list-card"><div class="row between"><span class="small muted">Питання ${q.id} · № у файлі ${q.sourceNumber}</span>${statusBadge(q)}</div><div class="qtext">${esc(q.text)}</div>${q.options.map((o, i) => `<div class="mini-answer ${q.correct.includes(i) ? 'good' : ''}">${String.fromCharCode(65 + i)}. ${esc(o)}${q.correct.includes(i) ? ' OK' : ''}</div>`).join('')}${q.note ? `<div class="small muted">${esc(q.note)}</div>` : ''}</div>`).join('');

    app.innerHTML = header() + `<div class="card hero"><h1>Усі питання</h1><p>Правильні варіанти одразу підсвічені зеленим.</p></div><input id="search" class="search" placeholder="Пошук по 435 питаннях" value="${esc(searchTerm)}"><div class="small muted" style="margin:10px 2px">Знайдено: ${filtered.length}</div>${list || '<div class="empty">Нічого не знайдено</div>'}`;
    $('#search').oninput = (e) => {
      searchTerm = e.target.value;
      renderAll();
      const i = $('#search');
      i.focus();
      i.setSelectionRange(i.value.length, i.value.length);
    };
  }

  function renderMistakes() {
    const bad = Q.filter((q) => effectiveScorable(q) && selected(q) !== null && !isCorrect(q));
    const list = bad.map((q) => `<div class="card list-card"><div class="small muted">Питання ${q.id}</div><div class="qtext">${esc(q.text)}</div><div class="mini-answer bad"><b>Твоя:</b> ${esc(q.options[selected(q)])}</div><div class="mini-answer good"><b>Правильна:</b> ${esc(q.options[q.correct[0]])}</div></div>`).join('');
    app.innerHTML = header() + `<div class="card hero"><h1>Помилки</h1><p>${bad.length ? `Тут зібрано ${bad.length} ${bad.length === 1 ? 'помилку' : 'помилок'}, щоб повторити їх окремо.` : 'Поки що немає жодної помилки.'}</p></div>${list || `<div class="empty">Відповідай на питання - помилки автоматично з'являться тут.</div>`}`;
  }

  function renderStats() {
    const st = stats();
    const blocks = Math.ceil(Q.length / 10);
    let doneBlocks = 0;
    for (let b = 1; b <= Q.length; b += 10) if (blockQuestions(b).every(seen)) doneBlocks++;

    let bbuttons = '';
    for (let b = 1; b <= Q.length; b += 10) {
      const arr = blockQuestions(b);
      const done = arr.every(seen);
      bbuttons += `<button class="block-btn ${done ? 'done' : ''}" data-block="${b}">${b}-${arr[arr.length - 1].id}${done ? ' OK' : ''}</button>`;
    }

    app.innerHTML = header() + `<div class="card hero"><div class="big-number">${st.pct}%</div><div class="muted">загальний прогрес</div>${progressBar()}</div><div class="statgrid"><div class="stat"><div class="n">${st.correct}</div><div class="muted small">правильних</div></div><div class="stat"><div class="n">${st.wrong}</div><div class="muted small">помилок</div></div><div class="stat"><div class="n">${st.seenN}</div><div class="muted small">переглянуто</div></div><div class="stat"><div class="n">${doneBlocks}/${blocks}</div><div class="muted small">блоків</div></div></div><div class="section-title">Блоки по 10</div><div class="block-grid">${bbuttons}</div><div class="card"><div class="section-title" style="margin-top:0">На iPhone / iPad як застосунок</div><ol class="install-steps"><li>Відкрий сайт саме у Safari.</li><li>Натисни кнопку «Поділитися».</li><li>Обери «На екран "Домівка"».</li><li>Після першого завантаження PWA працює офлайн.</li></ol></div><button class="btn danger" id="reset">Скинути весь прогрес</button><div class="footer-note">Питання перенесені з наданого DOCX. Питання без зображень із вихідного файла та неоднозначні елементи позначені окремо й не впливають на оцінку.</div>`;

    document.querySelectorAll('[data-block]').forEach((b) => {
      b.onclick = () => {
        const start = Number(b.dataset.block);
        const qq = blockQuestions(start).find((x) => !seen(x)) || blockQuestions(start)[0];
        currentId = qq.id;
        summaryBlock = null;
        showTab('test');
      };
    });
    $('#reset').onclick = () => {
      if (confirm('Скинути всі відповіді та прогрес?')) {
        state = { answers: {}, seen: {} };
        save();
        currentId = 1;
        summaryBlock = null;
        renderStats();
      }
    };
  }

  document.querySelectorAll('.nav button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
  render();
})();
</script></body></html>
