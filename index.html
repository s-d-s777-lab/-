и до боків і грудей, якщо у воді знаходиться кілька людей, необхідно якомога тісніше притулитися один до одного, зберігаючи вертикальне положення, необхідно уникати розлитого на водній поверхні палива, якщо це зробити неможливо, слід спробувати пропливти через нього з високо піднятою головою і закритим ротом;","не можна рухатися у воді для зігрівання, це призводить до більш швидкого переохолодження організму, знаходячись у воді, слід підтягнути схрещені ноги до живота, а руки притиснути до боків і грудей, якщо у воді знаходиться кілька людей, необхідно відплисти від групи та просити про допомогу, необхідно уникати розлитого на водній поверхні палива, якщо це зробити неможливо, слід спробувати пропливти через нього з високо піднятою головою і закритим ротом."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":91,"sourceNumber":90,"text":"Яке маркування повинно наноситися на рятувальні кола прогулянкового/малого судна?","options":["маркування виробника;","дати виготовлення;","найменування (реєстраційний номер) судна."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":92,"sourceNumber":91,"text":"Як повинно маневрувати прогулянкове/мале судно, рятуючи утопаючого?","options":["для порятунку потопаючого необхідно маневрувати для підходу до нього на прогулянковому/малому судні здійснювати, як правило, по течії (за вітром) та на такому ходу, щоб виключити будь-яку можливість наїзду на потопаючого;","для порятунку потопаючого необхідно маневрувати у вільній формі для підходу до нього на прогулянковому/малому судні на такому ходу, щоб виключити будь-яку можливість наїзду на потопаючого;","для порятунку потопаючого необхідно маневрувати для підходу до нього на прогулянковому/малому судні здійснювати, як правило, проти течії (проти вітру) та на такому ходу, щоб виключити будь-яку можливість наїзду на потопаючого."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":93,"sourceNumber":92,"text":"Як належить виконувати підйом потерпілих з води в прогулянкове/мале судно?","options":["піднімаючи на борт потопаючого необхідно стежити, щоб човен не перекинувся. Для цього необхідно підйом робити з лівого борту прогулянкового/малого судна при непрацюючому двигуні. При підйомі потопаючого на борт діяти необхідно швидко і рішуче не допускаючи, щоб потопаючий захопив рятувальника, тому що рухи потопаючого можуть бути неадекватними;","піднімаючи на борт потопаючого необхідно стежити, щоб човен не перекинувся. Для цього необхідно підйом робити з носа або корми при непрацюючому двигуні. При підйомі потопаючого на борт, діяти необхідно швидко і рішуче не допускаючи, щоб потопаючий захопив рятувальника, тому що рухи потопаючого можуть бути неадекватними;","піднімаючи на борт потопаючого необхідно стежити, щоб човен не перекинувся. Для цього необхідно підйом робити з правого борту прогулянкового/малого судна при непрацюючому двигуні. При підйомі потопаючого на борт діяти необхідно швидко і рішуче не допускаючи, щоб потопаючий захопив рятувальника, тому що рухи потопаючого можуть бути неадекватними."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":94,"sourceNumber":93,"text":"Що необхідно зробити для звільнення дихальних шляхів потерпілого?","options":["покласти потерпілого животом донизу та зробити декілька ударів по спині;","зробити масаж грудної клітини;","покласти потерпілого на коліно животом, обличчям донизу, засунути два пальці до роту потерпілого і натиснути на корінь язика."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":95,"sourceNumber":94,"text":"На який максимальний термін може бути накладений кровоспинний джгут?","options":["1,5 години у зимовий період, 2 години у літній період;","2 години у зимовий період, 3 години у літній період;","2 години."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":96,"sourceNumber":95,"text":"Постраждалий знаходиться без свідомості. Дихання, пульс відсутні. Ваші дії?","options":["покласти потерпілого обличчям донизу, голова повинна бути нижче рівня тулуба, звільнити дихальні шляхи;","повернути потерпілого до свідомості, шляхом непрямого масажу серця та штучного дихання;","покласти потерпілого обличчям донизу, голова повинна бути нижче рівня тулуба, звільнити дихальні шляхи, докласти зусиль для відновлення дихання, шляхом непрямого масажу серця та штучного дихання, викликати швидку допомогу."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":97,"sourceNumber":96,"text":"Де мають знаходитись індивідуальні рятувальні засоби, під час руху прогулянкового/малого судна?","options":["повинні бути одягнуті на всіх пасажирів, включаючи судноводія;","в легкодоступному місці на борту судна;","в кормовій частині судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":98,"sourceNumber":97,"text":"Яку кількість людей може підтримувати на воді рятувальний круг?","options":["лише одну людину;","скористатись може дві особи за умови, якщо триматись за леєр зі зовнішньої сторони;","залежно від технічних характеристик рятувального круга."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":99,"sourceNumber":98,"text":"Як потрібно підходити на судні для спасіння потопаючого, при вітряній погоді?","options":["проти вітру (хвилі, течії) та з безпечною швидкістю для запобігання наїзду на потопаючого;","за вітром та з безпечною швидкістю для запобігання наїзду на потопаючого;","лагом до вітру та хвилі з безпечною швидкістю для запобігання наїзду на потопаючого."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":100,"sourceNumber":99,"text":"Як повинен маневрувати судноводій прогулянкового/малого судна, якщо при підході до людини за бортом з поворотом на 360 градусів не вдалося зупинитися з навітряної сторони від постраждалого?","options":["зупинити судно за допомогою якоря та продовжити маневри з порятунку постраждалого;","відійти на безпечну відстань від потерпілого та повторити маневр з урахуванням поправок від дії вітру, хвилі, течії;","відпрацювати двигуном в зворотній бік та зупинитись біля постраждалого."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":101,"sourceNumber":100,"text":"Які рятувальні засоби мають знаходиться на прогулянковому/малому судні і їх кількість?","options":["рятувальні жилети для кожного з пасажирів (включаючи судноводія), рятувальний круг при умові загальної кількості до восьми людей на борту судна;","рятувальні жилети для кожного з пасажирів (включаючи судноводія), рятувальний круг при умові до восьми людей на борту судна та два рятувальних круга при умові загальної кількості до дванадцяти людей на борту судна;","рятувальні жилети для кожного з пасажирів (включаючи судноводія), два рятувальних круга при умові до восьми людей на борту судна та три рятувальних круга при умові загальної кількості до дванадцяти людей на борту судна."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":102,"sourceNumber":101,"text":"Якої довжини повинен бути рятувальний кінець, що закріплений до рятувального кола?","options":["не менше 30 метрів;","не менше 15 метрів;","не менше 45 метрів."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":103,"sourceNumber":102,"text":"Яка повинна бути дальність видимості сигналів світло димового буя?","options":["світло димовий буй рятувального круга забезпечує утворення щільного помаранчевого диму протягом 15 хвилин і має самостійно активуючу систему світлодіодних сигналів для використання в нічний час;","світло димовий буй рятувального круга забезпечує утворення щільного білого диму протягом 25 хвилин і має самостійно активуючу систему світлодіодних сигналів для використання в нічний час;","світло димовий буй рятувального круга забезпечує утворення щільного помаранчевого диму протягом 20 хвилин і має самостійно активуючу систему світлодіодних сигналів для використання в нічний час."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":104,"sourceNumber":103,"text":"На які види поділяються сучасні суднові рятувальні засоби?","options":["пересувні та стаціонарні;","індивідуальні надувні і колективні стаціонарні;","індивідуальні і колективні."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":105,"sourceNumber":104,"text":"Які дії повинно виконати прогулянкове/мале судно у випадку падіння людини за борт і виконання маневру \"Простий поворот\" з цієї події?","options":["простий поворот. Перекласти кермо в положення \"На борт\", тільки в сторону протилежну стороні падіння людини. Після відхилення від початкового курсу на 180° перекласти кермо в положення \"Прямо\" і застопорити двигун;","простий поворот. Перекласти кермо в положення \"На борт\", тільки в бік падіння людини. Після відхилення від початкового курсу на 250° перекласти кермо в положення \"Прямо\" і застопорити двигун;","простий поворот. Перекласти кермо в положення \"На борт\", тільки в сторону протилежну стороні падіння людини. Після відхилення від початкового курсу на 250° перекласти кермо в положення \"Прямо\" і застопорити двигун."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":106,"sourceNumber":105,"text":"Яка кількість рятувальних кругів повинна бути передбачена на прогулянкових/малих суднах, суднах для перевезення організованих груп людей, а також на самохідних поромах габаритною довжиною L ≤ 24 м?","options":["при загальній кількості людей на борту прогулянкового судна до 8 осіб - 2 кола, при загальному кількості людей на борту прогулянкового судна до 12 осіб - 3 кола;","при загальній кількості людей на борту прогулянкового судна до 8 осіб - 4 кола, при загальному кількості людей на борту прогулянкового судна до 12 осіб - 6 кола;","при загальній кількості людей на борту прогулянкового судна до 8 осіб - 6 кола, при загальному кількості людей на борту прогулянкового судна до 12 осіб - 8 кола."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":107,"sourceNumber":106,"text":"Яким чином виконується підхід на прогулянковому/малому судні до людини, що тоне на течії?","options":["за течією;","проти течії;","кормою судна проти течії."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":108,"sourceNumber":107,"text":"На скільки градусів рекомендується перекласти руль в навітряну сторону відразу після падіння людини за борт, щоб здійснити підхід до неї з поверненням на зворотній курс?","options":["необхідно негайно почати рух судна по курсу шляхом перекладання керма в положення \"Так тримати\". Після відхилення від вихідного курсу на 60° кермо перекладається на зворотній курс кермо перекладається в положення \"назад\", а потім судно лягає на зворотній курс для здійснення рятувальної операції;","необхідно негайно почати поворот судна в сторону випавшого, шляхом перекладання керма в положення \"на борт\". Після відхилення від вихідного курсу на 60° кермо перекладається на протилежний борт і не досягнувши 20° до зворотного курсу кермо перекладається в положення \"прямо\", а потім судно лягає на зворотній курс для здійснення рятувальної операції;","необхідно негайно почати поворот судна в сторону протилежну випавшого, шляхом перекладання керма в положення \"на борт\". Після відхилення від вихідного курсу на 60° кермо перекладається на протилежний борт і не досягнувши 20° до зворотного курсу кермо перекладається в положення \"прямо\", а потім судно лягає на зворотній курс для здійснення рятувальної операції."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":109,"sourceNumber":108,"text":"Яка кількість рятувальних кругів повинна бути на прогулянкових/малих суднах, габаритною довжиною до 24 метрів?","options":["при загальній кількості людей на борту судна до 8 осіб - 2 круга, при загальній кількості людей на борту судна до 12 осіб - 3 круга.","при загальній кількості людей на борту судна до 8 осіб - 4 круга, при загальній кількості людей на борту судна до 12 осіб - 6 кругів.","при загальній кількості людей на борту судна до 8 осіб - 1 круг, при загальній кількості людей на борту судна до 12 осіб - 2 круга."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":110,"sourceNumber":109,"text":"Чому дорівнює морська миля?","options":["дорівнює 1 хв. дуги земного меридіана, застосовується в округленому значенні - 1852 м;","дорівнює 1 хв. дуги земного меридіана, застосовується в округленому значенні - 1642 м;","дорівнює 1 хв. дуги земного меридіана, застосовується в округленому значенні - 1548 м."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":111,"sourceNumber":110,"text":"Від чого залежить дальність видимого горизонту?","options":["стану атмосфери та гостроти зору спостерігача;","стану атмосфери та наявності забруднюючих речовин в повітрі;","висоти ока спостерігача та висоти предмета, від стану атмосфери."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":112,"sourceNumber":111,"text":"Які напрямки наносяться або знімаються на навігаційних мапах?","options":["розрахункові значення величин;","глибини;","справжні значення величин."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":113,"sourceNumber":112,"text":"У яких межах вимірюється курсовий кут на орієнтир відносно діаметральної площини судна?","options":["курсовий кут вимірюється в градусах і відраховується на азимутному колі від 0 до 360°;","курсовий кут вимірюється в градусах і відраховується на азимутному колі від 0 до 180° в бік правого або лівого борту від напрямку прямо по носі;","курсовий кут вимірюється в градусах і відраховується на азимутному колі від 0° до 360° в бік корми від напрямку прямо по носі."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":114,"sourceNumber":113,"text":"По якій стороні рамки навігаційної мапи визначається довгота місця?","options":["на горизонтальній рамці;","на вертикальній рамці;","на горизонтальній та вертикальній рамці."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":115,"sourceNumber":114,"text":"По якій стороні рамки навігаційної мапи визначається широта місця?","options":["на вертикальній рамці;","на горизонтальній рамці;","на горизонтальній та вертикальній рамці."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":116,"sourceNumber":115,"text":"Пеленг в навігації це?","options":["процес визначення горизонтальних кутів між північнім напрямком меридіану и лінією з точки спостереження на об'єкт; вимірюється за годинниковою стрілкою від нуля до повної дуги окружності;","процес визначення горизонтальних кутів між північнім напрямком меридіану и лінією з точки спостереження на об'єкт; вимірюється проти годинникової стрілки від нуля до повної дуги окружності;","процес визначення горизонтальних кутів між північнім напрямком меридіану и лінією з точки спостереження на об'єкт; вимірюється проти годинникової стрілки від нуля до повної дуги окружності."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":117,"sourceNumber":116,"text":"Які показання знімаються з магнітного компасу?","options":["по магнітному компасу визначають напрямки щодо руху відносно діаметральної площині судна;","по магнітному компасу визначають напрямки щодо компасного меридіану;","по магнітному компасу визначають напрямки руху судна відносно магнітного поля."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":118,"sourceNumber":117,"text":"Що означає позначення на навігаційній карті?","options":["позначення неосвітлюваного навігаційного буя;","затонуле судно, якого не видно над водою;","затонуле судно, щогла якого видно над водою."],"correct":[2],"status":"verified","note":"У вихідному DOCX зображення для цього питання відсутнє.","needsImage":true,"scorable":false},{"id":119,"sourceNumber":118,"text":"Однією із систем розподілення горизонту є румбова. На скільки румбів ділиться горизонт? Чому дорівнює один румб?","options":["горизонт ділиться на 32 румба, один румб дорівнює - 11,25°;","горизонт ділиться на 23 румба, один румб дорівнює - 15,25°;","горизонт ділиться на 35 румба, один румб дорівнює - 16,25°."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":120,"sourceNumber":119,"text":"Як буде називатися положення орієнтира розташованого відносно діаметральної площини судна на 90° лівого або правого борту?","options":["траверз;","фордевінд;","бакштаг."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":121,"sourceNumber":120,"text":"Як називається кут відхилення судна від курсу під дією вітру?","options":["кут відхилення;","кут курсу;","кут дрейфу."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":122,"sourceNumber":121,"text":"Які основні ознаки поліпшення погоди?","options":["постійне підвищення тиску, рівний спокійний вітер. зникнення перисті хмари, ранковий туман;","постійне підвищення тиску, рівний спокійний вітер. зникнення перисті хмари, ранковий туман, червоний захід сонця, зірки світять яскраво, чистий горизонт при сході сонця;","постійне падіння тиску, рівний спокійний вітер, зникнення перисті хмари, зірки світять яскраво, чистий горизонт при сході сонця."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":123,"sourceNumber":122,"text":"В чому проявляються основні ознаки зміни погоди до погіршення?","options":["постійне зниження атмосферного тиску, посилення вітру ввечері і вночі, різка зміна напрямку вітру, південний вітер змінює свій напрямок на схід, птахи літають низько над водою, червоний схід, зірки яскраво світять;","постійне підвищення атмосферного тиску, посилення вітру ввечері і вночі, різка зміна напрямку вітру, південний вітер змінює свій напрямок на схід, червоний схід;","постійне зниження атмосферного тиску, різка зміна напрямку вітру, дме північний вітер, червоний схід, зірок не видно."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":124,"sourceNumber":123,"text":"Чи має вплив температура повітря на управління маломірним судном?","options":["температура повітря впливає на остійність та осадку судна;","температура повітря може вплинути на міцність корпусу та непотоплюваність;","температура повітря не має впливу на управління прогулянковим/малим судном."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":125,"sourceNumber":124,"text":"В чому проявляється конденсація парів?","options":["при охолодженні повітря воно може виявиться настільки насиченим водяною парою, що подальше охолодження викличе конденсацію, тобто утворенню вологи у вигляді інею, роси, туману, хмар, дощу або снігу;","при охолодженні повітря воно може виявиться настільки насиченим водяною парою, що подальше охолодження викличе конденсацію, тобто утворенню вологи у вигляді роси;","при охолодженні повітря він може виявиться настільки насиченим водяною парою, що подальше охолодження викличе конденсацію, тобто утворенню вологи у вигляді туману."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":126,"sourceNumber":125,"text":"Як називається атмосферний вихор великого діаметру з низьким тиском повітря в центрі?","options":["антициклон;","циклон;","пасат."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":127,"sourceNumber":126,"text":"Як називається область високого атмосферного тиску?","options":["антициклон;","циклон;","мусон."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":128,"sourceNumber":127,"text":"Що таке істинний вітер?","options":["вітер, який спостерігався б в даному місці з нерухомого судна. На рухомому судні, істинний вітер визначається або графічно, або за допомогою вітрочота, або кола Севастопольської морської обсерваторії;","вітер, який спостерігався б в даному місці з рухомого судна. На нерухомому судні, істинний вітер визначається або графічно, або за допомогою вітрочота, або кола Севастопольської морської обсерваторії;","вітер, який спостерігався б в даному місці з рухомого судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":129,"sourceNumber":128,"text":"Що таке уявний вітер?","options":["на суднах, які не перебувають в русі, спостерігається уявний вітер, що є векторною сумою істинного і курсового вітру;","на суднах, які перебувають в русі, спостерігається уявний вітер, що є векторною сумою істинного і курсового вітру, який у напрямку протилежний руху судна, а його швидкість дорівнює швидкості судна;","на суднах, які стоять, спостерігається уявний вітер, відносно іншого судна яке рухається."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":130,"sourceNumber":129,"text":"Яким способом і в яких одиницях виміру визначають силу вітру по його дії на водну поверхню?","options":["силу вітру в балах (м/сек.) можна визначити, по його дії на маломірне судно;","силу вітру в балах (м/сек.) можна визначити, по його дії на водну поверхню. При цьому керуються спеціальною таблицею, так званою шкалою Бофорта (МТ-75, тбл. 49, Шкала для візуальної оцінки сили вітру);","силу вітру в балах (км/год) можна визначити, по його дії на водну поверхню. При цьому керуються спеціальним приладом анемометром."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":131,"sourceNumber":130,"text":"Яку назву має сильний, холодний вітер, що дує з прибережних гір в сторону моря?","options":["бора;","фен;","бриз."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":132,"sourceNumber":131,"text":"Які ознаки наближаючого шквалу?","options":["посиленням вітру пов'язане з різким похолоданням або потеплінням;","посиленням вітру пов'язане з швидким рухом перестих хмар;","посиленням вітру пов'язане з купчасто-дощовими хмарами."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":133,"sourceNumber":132,"text":"Які дії судноводія при ударі шквалу з носових курсових кутів?","options":["необхідно розташувати судно носом за вітром, а при наближенні шквалу з кормових курсових кутів необхідно розташувати судно носом проти вітру;","необхідно розташувати судно носом проти вітру, а при наближенні шквалу з кормових курсових кутів необхідно розташувати судно носом за вітром;","необхідно розташувати судно носом за вітром, а при наближенні шквалу з кормових курсових кутів необхідно розташувати судно носом проти вітру."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":134,"sourceNumber":133,"text":"Як повинен діяти судноводій прогулянкового/малого судна при керуванні в умовах хвилювання та при штормі?","options":["необхідно задраять всі люки, горловини, ілюмінатори, перевірити працездатність водовідливних засобів, закріпити всі предмети, що можуть переміщатися при хитавиці. Керувати судном необхідно так, щоб уникати потрапляння води всередину судна. Для цього при управлінні судном в умовах штормової погоди судноводію прогулянкового/малого судна необхідно вибрати такий напрямок руху судна та його швидкості, щоб судно не заривалося носом в хвилю при проходженні курсом проти хвилі, а при проходженні по хвилі або уздовж хвилі необхідно уникати ударів об борт;","необхідно задраять всі люки, горловини, ілюмінатори, перевірити працездатність водовідливних засобів, закріпити всі предмети, що можуть переміщатися при хитавиці. За можливістю пришвартувати судно;","при управлінні судном в умовах штормової погоди судноводію прогулянкового/малого судна необхідно вибрати такий напрямок руху судна та його швидкість, щоб максимально швидко пришвартувати судно."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":135,"sourceNumber":134,"text":"Який порядок руху швидкісних прогулянкових/малих суден при видимості, менше 0,5 км?","options":["рух прогулянкових/малих суден при видимості менше 500 м забороняється;","рух прогулянкових/малих суден при видимості менше 500 м дозволяється в режимі \"малий хід\";","рух прогулянкових/малих суден при видимості менше 500 м дозволяється без обмежень."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":136,"sourceNumber":135,"text":"Основними ознаками наближення циклону є:","options":["поява брижі від напрямку, яка збігається з напрямком вітру, швидке падіння тиску, поява перистих, а потім на горизонті зливових хмар, задушлива погода, затишшя, часті і сильні електричні розряди в атмосфері, збільшення швидкості вітру;","поява брижі від напрямку, яка збігається з напрямком вітру, швидке зростання тиску, поява перистих, а потім на горизонті зливових хмар, задушлива погода, затишшя, часті і сильні електричні розряди в атмосфері, збільшення швидкості вітру;","різке похолодання, поява брижі від напрямку, яка не збігається з напрямком вітру, швидке падіння тиску, поява перистих, а потім на горизонті зливових хмар, збільшення швидкості вітру."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":137,"sourceNumber":136,"text":"Чи дозволяється вихід прогулянкових/малих суден в несприятливі погодні умови на внутрішніх водних шляхах України?","options":["забороняється;","дозволяється;","дозволяється, за наявності рятувальних приладів і засобів зв'язку."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":138,"sourceNumber":137,"text":"Дії судноводіїв прогулянкових/малих суден при погіршенні гідрометеорологічних умов?","options":["судноводій повинен одягти рятувальний жилет;","судноводій повинен негайно скрити своє судно в безпечному місці;","судноводій повинен дотримуватися правил з безпеки судноплавства."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":139,"sourceNumber":138,"text":"Дії судноводія при штормі?","options":["необхідно задраять всі люки, горловини, ілюмінатори, перевірити працездатність водовідливних засобів, закріпити всі предмети, що можуть переміщатися при хитавиці. Керувати судном необхідно так, щоб уникати потрапляння води всередину судна. Для цього при управлінні судном в умовах штормової погоди судноводію прогулянкового/малого судна необхідно вибрати такий напрямок руху судна та його швидкості, щоб судно не заривалося носом в хвилю при проходженні курсом проти хвилі, а при проходженні по хвилі або уздовж хвилі необхідно уникати ударів об борт;","необхідно задраять всі люки, горловини, ілюмінатори, перевірити працездатність водовідливних засобів, закріпити всі предмети, що можуть переміщатися при хитавиці, та за можливістю пришвартувати судно;","при управлінні судном в умовах штормової погоди судноводію прогулянкового/малого судна необхідно вибрати такий напрямок руху судна та його швидкість, щоб максимально швидко пришвартувати судно."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":140,"sourceNumber":139,"text":"Про що свідчить таке явище, коли слоїсті хмари світлішають, а атмосферний тиск повільно збільшується?","options":["ознаки поліпшення погоди;","посилення вітру ввечері і вночі;","ознаки погіршення погоди."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":141,"sourceNumber":140,"text":"Що вимірюється ручним анемометром?","options":["швидкості потоку і напрямку руху повітря;","швидкості руху судна;","швидкості потоку і напрямку руху течії."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":142,"sourceNumber":141,"text":"Вітер, за напрямом носу судна, це?","options":["левентік;","іст;","фордевінд."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":143,"sourceNumber":142,"text":"Які дії повинен зробити судноводій, якщо під час руху судна, видимість різко зменшилась менше ніж на 500 метрів?","options":["зменшити швидкість руху до 10 км/год;","вибрати безпечну швидкість;","зупинити судно."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":144,"sourceNumber":143,"text":"Які ознаки має льодостав?","options":["поява крижаного сала свідчить про наближення льодоставу;","поява забереги, крижаного сала шуги свідчить про наближення льодоставу;","температура води нижче \"- 10 С\" свідчить про наближення льодоставу."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":145,"sourceNumber":144,"text":"Які дії необхідно зробити водію прогулянкового/малого судна, який потрапив в штормові умови, щоб забезпечити безпеку?","options":["необхідно задерти носові люки, горловини, ілюмінатори, перевірити працездатність водовідливних засобів. Керувати судном необхідно так. щоб уникнути попадання води всередину судна;","необхідно задерти все люки, горловини, ілюмінатори, перевірити працездатність водовідливних засобів, закріпити всі предмети, що можуть переміщатися при хитавиці. Керувати судном необхідно так, щоб уникнути попадання води всередину судна;","необхідно відчинити все люки, горловини, ілюмінатори, перевірити працездатність водовідливних засобів, закріпити всі предмети, що можуть переміщатися при хитавиці. Керувати судном необхідно так, щоб уникнути попадання води всередину судна."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":146,"sourceNumber":145,"text":"У яких місцях прогулянковим/малим суднам забороняється ставати на якір?","options":["в зоні дії знаку \"Якір не кидати!\", на фарватері і ближче 5 м від кромок знаків фарватеру, в колінах, вузкостях, на крутих поворотах, на акваторіях рейдів, пляжів, у берега з прижимною течією, у вігнутих берегів, у мостів, у гідроспоруд, водолазних ботів ближче, ніж 200 м, під лініями зв'язку та електромереж, близько ходового берега, близько вантажних причалів, дебаркадерів на відстані 200 м вище і нижче їх, вище і нижче мостів ближче, ніж 200 м, поблизу немаломірних судів, земснарядів, плавучих кранів і між ними, при недостатньому водному просторі при зміні положення судна в разі зміни вітру (Течії);","в зоні дії знаку \"Якір не кидати!\", на фарватері і ближче 25 м від кромок знаків фарватеру, в колінах, вузкостях, на крутих поворотах, на акваторіях рейдів, пляжів, у берега з прижимною течією, у вігнутих берегів, у мостів, у гідроспоруд, водолазних ботів ближче, ніж 200 м, під лініями зв'язку та електромереж, близько ходового берега, близько вантажних причалів, дебаркадерів на відстані 200 м вище і нижче їх, вище і нижче мостів ближче, ніж 200 м, поблизу немаломірних судів, земснарядів, плавучих кранів і між ними, при недостатньому водному просторі при зміні положення судна в разі зміни вітру (Течії);","в зоні дії знаку \"Якір не кидати!\", на фарватері і ближче 5 м від кромок знаків фарватеру, в колінах, вузкостях, на крутих поворотах, на акваторіях рейдів, пляжів, у берега з прижимною течією, у вігнутих берегів, у мостів, у гідроспоруд, водолазних ботів ближче, ніж 100 м, під лініями зв'язку та електромереж, близько ходового берега, близько вантажних причалів, дебаркадерів на відстані 200 м вище і нижче їх, вище і нижче мостів ближче, ніж 200 м, поблизу немаломірних судів, земснарядів, плавучих кранів і між ними, при недостатньому водному просторі при зміні положення судна в разі зміни вітру (Течії)."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":147,"sourceNumber":146,"text":"Яка процедура постановки судна на якір?","options":["маневр по постановці судна на якір полягає в наступному: підходити до місця якірної стоянки слід малим ХОДОМ, необхідно розгорнути судно носом проти вітру (Течії), застопорити мотор і рухатися за інерцією до точки віддачі якоря, в разі необхідності відпрацювати заднім ходом до повної зупинки судна щодо берега (дна) і на малої інерції заднього ходу віддати якір, витравити необхідну кількість якірного каната, закріпити якірний канат, почекати коли судно вийде на повну довжину якірного каната, переконатися, що якір не повзе по ґрунті, тобто якір забрав за ґрунт, в разі необхідності стравити якірний канат;","маневр по постановці судна на якір полягає в наступному: підходити до місця якірної стоянки слід повним ХОДОМ, необхідно розгорнути судно носом проти вітру (Течії), застопорити мотор і рухатися за інерцією до точки віддачі якоря, в разі необхідності відпрацювати заднім ходом до повної зупинки судна щодо берега (дна) і на малої інерції заднього ходу віддати якір, витравити необхідну кількість якірного каната, закріпити якірний канат, почекати коли судно вийде на повну довжину якірного каната, переконатися, що якір не повзе по ґрунті, тобто якір забрав за ґрунт, в разі необхідності стравити якірний канат;","маневр по постановці судна на якір полягає в наступному: підходити до місця якірної стоянки слід повним ХОДОМ, необхідно розгорнути судно носом по вітру (Течії), застопорити мотор і рухатися за інерцією до точки віддачі якоря, в разі необхідності відпрацювати заднім ходом до повної зупинки судна щодо берега (дна) і на малої інерції заднього ходу віддати якір, витравити необхідну кількість якірного каната, закріпити якірний канат, почекати коли судно вийде на повну довжину якірного каната, переконатися, що якір не повзе по ґрунті, тобто якір забрав за ґрунт, в разі необхідності стравити якірний канат."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":148,"sourceNumber":147,"text":"Що включає підготовку прогулянкового/малого судна до постановки на якір?","options":["вибір місця якірної стоянки, вибір безпечного курсу і швидкості при проходженні до місця взяття на якір, підготовка якоря до віддачі, підготовка якірного каната до віддачі, корінний кінець якого повинен бути надійно закріплений на судні, облік достатнього водного простору при зміні положення судна в разі зміни напрямку вітру (Течії);","вибір місця якірної стоянки, підготовка якірного каната до віддачі, корінний кінець якого повинен бути надійно закріплений на судні;","вибір місця якірної стоянки, облік достатнього водного простору при зміні положення судна в разі зміни напрямку вітру (Течії)."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":149,"sourceNumber":148,"text":"У який час доби дозволяється заходити в акваторію пасажирської та вантажної дільниці річкового порту?","options":["забороняється, у будь який час;","дозволяється, у денний час доби;","дозволяється, у нічний час доби."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":150,"sourceNumber":149,"text":"Чи можна прогулянковим/малим суднам швартуватись до транспортних суден, що стоять на рейдах портів?","options":["дозволяється, якщо зазначена дія не суперечить місцевим правилам судноплавства;","забороняється;","дозволяється."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":151,"sourceNumber":150,"text":"Чи дозволяється прогулянковому/малому судну ставати на якір, у межах якірної стоянки для транспортних суден?","options":["дозволяється;","дозволяється, якщо зазначена дія не суперечить місцевим правилам судноплавства;","забороняється."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":152,"sourceNumber":151,"text":"Які існують варіанти підходу суден до причалу?","options":["судно може підходити до причалу тільки правим бортом з віддачею якоря або без;","судно може підходити до причалу лівим бортом з віддачею якоря або без;","судно може підходити до причалу бортом (правим або лівим), кормою або носом, з віддачею якоря або без."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":153,"sourceNumber":152,"text":"Як називається підхід прогулянкового/малого судна до причалу?","options":["привал;","стоянка;","перекат."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":154,"sourceNumber":153,"text":"Які дії потрібно виконати по підготовці судна до швартування?","options":["на судні завчасно підготовлюють швартовні кінці. Палубну команду викликають на палубу по авралу, де кожен член екіпажу займає своє місце згідно з розкладом;","на судні завчасно підготовлюють швартовні кінці, брашпиль, лебідки, кидальний кінець, кранці, судновий зв'язок та інші засоби і пристосування. Палубну команду викликають на палубу по авралу, де кожен член екіпажу займає своє місце згідно з розкладом;","на судні завчасно підготовлюють судновий зв'язок та інші засоби і пристосування. Палубну команду викликають на палубу по авралу, де кожен член екіпажу займає своє місце згідно з розкладом."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":155,"sourceNumber":154,"text":"Що потрібно враховувати при швартуванні судна до причалу?","options":["стан видимості, наявність безпечної для швартування довжини причальної стінки, достатній кранцевий захист причалу, наявність на причалі виступаючих пристроїв (крани і т. і.), наявність бітенгів, кнехтів, палів для кріплення швартових, достатнього водного простору для маневрування судна, наявність достатньої ширини біля причалу і на підходах до причалу, потреба в допомозі буксирів;","напрямок і силу вітру, наявність сили і напряму течії, стан видимості, наявність безпечної для швартування довжини причальної стінки, достатній кранцевий захист причалу, наявність на причалі виступаючих пристроїв (крани і т. і.), наявність бітенгів, кнехтів, палів для кріплення швартових, достатнього водного простору для маневрування судна, наявність достатньої глибини біля причалу і на підходах до причалу, потреба в допомозі буксирів;","напрямок і силу вітру, наявність сили і напряму течії, стан видимості, наявність безпечної для швартування довжини причальної стінки, достатній кранцевий захист причалу, наявність на причалі виступаючих пристроїв (крани і т. і.), наявність рятувальних засобів, достатнього водного простору для маневрування судна, наявність достатньої глибини біля причалу і на підходах до причалу, потреба в допомозі буксирів."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":156,"sourceNumber":155,"text":"У яких випадках дозволяється швартуватися до борту іншого судна?","options":["судно, до якого швартується інше судно бортом, може перебувати на ходу (в русі), біля причалу, на якорі або дрейфі. Швартування можливо, по-перше, з дозволу капітана судна, до якого має намір пришвартуватися інше судно і по-друге, при таких умовах і обставинах, які б абсолютно мінімізували будь-які небезпеки суден з урахуванням всіх умов і обставин моменту дій. Спосіб швартування вибирають обидва капітана. В разі розбіжності вирішальне слово за капітаном до якого швартуються;","судно, до якого швартується інше судно бортом, може перебувати тільки на якорі або дрейфі. Швартування можливо, по-перше, з дозволу капітана судна, до якого має намір пришвартуватися інше судно і, по-друге, при таких умовах і обставинах, які б абсолютно мінімізували будь-які небезпеки суден з урахуванням всіх умов і обставин моменту дій. Спосіб швартування вибирають обидва капітана. В разі розбіжності вирішальне слово за капітаном який швартуються;","судно, до якого швартується інше судно бортом, може перебувати на ходу (в русі) та дрейфі. Швартування можливо, при таких умовах і обставинах, які б абсолютно мінімізували будь-які небезпеки суден з урахуванням всіх умов і обставин моменту дій. Спосіб швартування вибирають обидва капітана. В разі розбіжності вирішальне слово за капітаном який швартуються."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":157,"sourceNumber":156,"text":"Підхід судна, яке йде за течією, до причалу чи берега здійснюється?","options":["підхід судна до причалу при попутної течії необхідно проводити на інерції з урахуванням сили течії під кутом до причалу 45 - 50° і після подачі, і кріплення носового швартового підводити корму за допомогою двигуна і керма. Підхід судна до берега при попутної течії необхідно проводити на малому ходу або поштовхами з урахуванням сили течії, контролюючи зменшення глибини ехолотом і футштоком;","підхід судна до причалу при попутної течії необхідно проводити на інерції з урахуванням сили течії під кутом до причалу 10 - 15° і після подачі, і кріплення носового швартового підводити корму за допомогою двигуна і керма. Підхід судна до берега при попутної течії необхідно проводити на малому ходу або поштовхами з урахуванням сили течії, контролюючи зменшення глибини ехолотом і футштоком;","підхід судна до причалу при попутної течії необхідно проводити на інерції з урахуванням сили течії під кутом до причалу 15 - 20° і після подачі, і кріплення носового швартового підводити корму за допомогою двигуна і керма. Підхід судна до берега при попутної течії необхідно проводити на малому ходу або поштовхами з урахуванням сили течії, контролюючи зменшення глибини ехолотом і футштоком."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":158,"sourceNumber":157,"text":"У який час, прогулянкове/мале судно може проходити шлюз?","options":["у будь-який час доби;","тільки в світлий час доби;","в темний час доби."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":159,"sourceNumber":158,"text":"У який термін, судноводії суден, що йдуть на шлюзування, повинні повідомити про час підходу до меж шлюзу?","options":["за чотири години;","за годину;","за дві години."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":160,"sourceNumber":159,"text":"Хто керує процесом шлюзування суден?","options":["чергово-вахтова служба;","головний механік шлюзу;","начальник вахти шлюзу."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":161,"sourceNumber":160,"text":"Що являється дозвільним сигналом заходу суден до шлюзу?","options":["на вхідних світлофорах повинно горіти два білих вогні, розташованих по горизонталі;","на вхідних світлофорах повинен горіти один зелений вогонь або два зелених вогні, розташованих по вертикалі;","на вхідних світлофорах повинен горіти один зелений вогонь або два зелених вогні, розташованих по горизонталі."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":162,"sourceNumber":161,"text":"Що являється дозвільним сигналом заходу суден до причальних пірсів?","options":["голосова команда про дозвіл на вхід за допомогою радіостанції;","зелений вогонь або два зелених вогні, розташованих по вертикалі на дальніх світлофорах;","зелений вогонь або два зелених вогні, розташованих по горизонталі на дальніх світлофорах."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":163,"sourceNumber":162,"text":"З якою швидкістю дозволяється входити до шлюзу?","options":["вантажним складам - не більше 0,8 м/сек., одиночним самохідним судам - не більше 1,0 м/сек.;","незалежно від розмірів та кількості суден - не більше 1,0 м/с;","на мінімальних обертах головного двигуна судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":164,"sourceNumber":163,"text":"Де дозволяється швартування суден у підхідному каналі при очікуванні шлюзування?","options":["швартування суден у підхідному каналі заборонено;","біля причальних пірсів підхідного каналу шлюзу;","очікування шлюзування дозволено лише на якорі біля підхідного каналу шлюзу."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":165,"sourceNumber":164,"text":"У яких випадках припиняється тимчасове шлюзування малих суден через шлюзи?","options":["під час сили вітру більше 5,0 м/с та видимості менше 1000 метрів;","під час сили вітру більше 3,4 м/с та видимості менше 500 метрів;","під час сили вітру більше 10,0 м/с та видимості менше 500 метрів;"],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":166,"sourceNumber":165,"text":"Який порядок шлюзування прогулянкових/малих суден?","options":["заходити в шлюзову камеру можна тільки при зеленому світлі близького світлофора і після дозволу начальника вахти шлюзу із зазначенням номера рима швартування, тримаючись осторонь від інших суден;","під час шлюзування спільно з транспортними судами прогулянкові/малі судна заходять в шлюзову камеру останніми;","обидві відповіді вірні."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":167,"sourceNumber":166,"text":"Які знаки, крім світлофорів, виставляються на стінках камер шлюзів та причальних пірсів?","options":["\"Обмежувальний\", який позначає довжину корисної довжини камери шлюзу і зону швартовки суден в підхідних каналах;","\"Стоповий\", який позначає довжину корисної довжини камери шлюзу і зону швартовки суден в підхідних каналах;","\"Мірильний\", який позначає довжину корисної довжини камери шлюзу."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":168,"sourceNumber":167,"text":"Чи дозволяється швартування прогулянкових/малих суден в камері судноплавного шлюзу під бортом інших суден?","options":["дозволяється з дозволу начальника вахти шлюзу;","забороняється тільки у темний час доби;","забороняється."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":169,"sourceNumber":168,"text":"Якою кількістю швартовних тросів повинне бути укомплектоване судно довжиною більше 6 метрів?","options":["не менш як двома тросами;","достатньою кількістю, але не менш як одним, розташованим на міделі судна;","достатньою кількістю, але не менш як двома, розташованими на носі та кормі судна."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":170,"sourceNumber":169,"text":"Як регулюється рух суден при шлюзуванні?","options":["двобарвними світлофорами спрямованої дії та радіотелефонним зв'язком в разі несправності світлофорів;","двобарвними світлофорами спрямованої дії та відмашками двокольоровими прапорами чергового в разі несправності світлофорів;","двобарвними світлофорами спрямованої дії."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":171,"sourceNumber":170,"text":"Яким чином повинні розходитися прогулянкові/малі судна, коли одне з них відходить від берега, а інше йде вздовж берега?","options":["судно, яке відходить від берега, має поступитися судну, що йде вздовж берега;","судно, яке йде вздовж берега, має дати дорогу судну, що відходить від берега;","судна повинні розійтись лівими бортами."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":172,"sourceNumber":171,"text":"При яких умовах здійснюється захід прогулянкового/малого судна в аванпорт та в підхідний канал шлюзу?","options":["заходити в аванпорт і підхідний канал шлюзу судну дозволено тільки після дозволу начальника вахти шлюзу, та на зелене світло дальніх світлофорів;","при силі вітру не більше 3 балів (3,4 - 5,4 м/сек) і видимості не менше 500 м;","обидві відповіді вірні."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":173,"sourceNumber":172,"text":"З якою метою на судні використовується плавучий якір?","options":["для поліпшення стійкості судна при плаванні в штормових умовах;","для зменшення швидкості дрейфу судна;","для поліпшення маневрених характеристик судна."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":174,"sourceNumber":173,"text":"Яким чином, на прогулянковому/малому судні, потрібно підходити до необладнаного берегу при сильній хвилі?","options":["заздалегідь знизивши швидкість, підходити поштовхами контролюючи зміну глибини ехолотом або футштоком;","заздалегідь знизивши швидкість, підходити лагом до берегу;","заздалегідь знизивши швидкість, використовуючи якірний пристрій."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":175,"sourceNumber":174,"text":"На яку відстань забороняється підпливати гідроцикли до пляжів і іншим організованим місцях купання?","options":["ближче ніж 50 метрів від буйків огородження;","ближче ніж 10 метрів від буйків огородження;","ближче ніж 25 метрів від буйків огородження."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":176,"sourceNumber":175,"text":"Чи дозволяється прогулянковим/малим суднам заходити в акваторії портів, суднобудівних заводів, терміналів?","options":["дозволяється;","забороняється;","забороняється, якщо не має згоди відповідальної особи за цю акваторію."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":177,"sourceNumber":176,"text":"На якій відстані дозволяється рухатись прогулянковим/малим суднам від причалів портів, суднобудівних заводів, терміналів?","options":["150 метрів;","300 метрів;","200 метрів."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":178,"sourceNumber":177,"text":"В чому полягають дії судноводія при забезпеченні безпеки стоянки судна на якорі?","options":["у загальному випадку судноводій повинен стежити за виконанням набору критеріїв \"безпечної якірної стоянки\", який включає: достатній навігаційний простір (з безпечними глибинами) для стоянки судна на якорі з урахуванням довжини судна, довжини витравленого якір-ланцюга, розвороту судна на якорі, додаткового витравлювання якір-ланцюга в разі погіршення погодних умов; можливість безпечної зйомки з якоря при погіршенні погодних умов;","у загальному випадку судноводій повинен стежити за виконанням набору критеріїв \"безпечної якірної стоянки\", який включає: безпека по глибині, тобто забезпечення достатнього запасу глибини під кілем протягом всього часу якірної стоянки, при будь-яких змінах рівня води, напрямку вітру, течії і ступеня хвилювання;","у загальному випадку судноводій повинен стежити за виконанням набору критеріїв \"безпечної якірної стоянки\", який включає: безпека по глибині, тобто забезпечення достатнього запасу глибини під кілем протягом всього часу якірної стоянки, при будь-яких змінах рівня води, напрямку вітру, течії і ступеня хвилювання; достатній навігаційний простір (з безпечними глибинами) для стоянки судна на якорі з урахуванням довжини судна, довжини витравленого якір-ланцюга, розвороту судна на якорі, додаткового витравлювання якір-ланцюга в разі погіршення погодних умов; можливість безпечного виконання необхідних операцій (вантажні операції, постачання та ін.); можливість укриття при несприятливих погодних умовах; можливість безпечної зйомки з якоря при погіршенні погодних умов."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":179,"sourceNumber":178,"text":"Які дії необхідно вжити судноводію прогулянкового/малого судна, що має один гвинт правого обертання на передньому ходу, щоб втримати судно на заданому ходу?","options":["шляхом перекладання керма на різні кути вліво;","шляхом перекладання керма на різні кути вліво та вправо;","шляхом перекладання керма вправо."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":180,"sourceNumber":179,"text":"Яке з суден, повинне поступитися шляхом іншому, якщо їхні курси перетинаються?","options":["те судно, яке має інше на своїй лівій стороні, повинно поступитися шляхом;","те судно, яке має інше на своїй правій стороні, повинно поступитися шляхом;","те судно, яке йде до низу, повинно поступитися шляхом."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":181,"sourceNumber":180,"text":"Як впливають мілини на керованість судном?","options":["на мілководді погіршується стійкість судна на курсі, з'являється рискливість, втрата швидкості через появи природних хвиль, спостерігається просідання судна;","на мілководді погіршується стійкість судна на курсі, з'являється рискливість, втрата швидкості через появи природних хвиль, спостерігається занурення судна;","на мілководді покращується стійкість судна на курсі, з'являється рискливість, втрата швидкості через появи природних хвиль, спостерігається просідання судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":182,"sourceNumber":181,"text":"Під впливом, яких чинників відбувається \"дрейф судна\"?","options":["виключно під впливом сили вітру;","під впливом сили вітру або течії, або того і іншого разом;","під впливом сили тяжіння."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":183,"sourceNumber":181,"text":"Як впливає течія на керованість судном?","options":["погіршується стійкість судна на курсі, з'являється рискливість, втрата швидкості через появи природних хвиль, спостерігається просідання судна;","під впливом течії відбувається дрейф - зміщення, що рухається судна з лінії справжнього курсу. Дія течії впливає і на керованість, судно стає не стійким на курсі, погіршується повороткість, відбувається уповільнення або збільшення швидкості;","при плаванні в умовах течії треба не допускати попадання води в середину судна і уникати втрати швидкості, для цього необхідно вибирати відповідний курс і швидкість судна по відношенню до течії."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":184,"sourceNumber":182,"text":"Що називається дрейфом судна?","options":["зміщення рухомого судна з лінії заданого курсу під впливом або вітру, або течії, або того й іншого разом. Дрейф судна - це також і переміщення судна з непрацюючим двигуном під впливом або вітру, або хвиль, або течії, або того, іншого і третього разом, а також коли судно на якорі, але якір не тримає і \"повзе\" по ґрунту;","зміщення не рухомого судна з лінії стоянки під впливом або вітру, або течії, або того й іншого разом. Дрейф судна - це також і переміщення судна з непрацюючим двигуном під впливом або вітру, або хвиль, або течії, або того, іншого і третього разом, а також коли судно на якорі, але якір не тримає і \"повзе\" по ґрунту;","зміщення рухомого судна вздовж лінії заданого курсу під впливом або вітру, або течії, або того й іншого разом. Дрейф судна - це також і переміщення судна з непрацюючим двигуном під впливом або вітру, або хвиль, або течії, або того, іншого і третього разом, а також коли судно на якорі, але якір не тримає і \"повзе\" по ґрунту."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":185,"sourceNumber":183,"text":"Які основні фактори впливають на величину дрейфу судна?","options":["конструктивні характеристики судна (форма обводів корпусу, розташування і величина надбудови, матеріал корпусу, та ін.), експлуатаційний стан судна (наявність крену, диференту, величина висоти надводного борту, величина опади тощо), зовнішні чинники (сила вітру, течії, висота хвилі, величина запасу води під кілем та ін.);","експлуатаційний стан судна (наявність крену, диференту, величина висоти надводного борту, величина опади тощо), зовнішні чинники (сила вітру, течії, висота хвилі, величина запасу води під кілем та ін.);","конструктивні характеристики судна (форма обводів корпусу, розташування і величина надбудови, матеріал корпусу, та ін.), зовнішні чинники (сила вітру, течії, висота хвилі, величина запасу води під кілем та ін.)."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":186,"sourceNumber":184,"text":"Які дії судноводія в умовах сильного хвилювання на  поверне на 90 градусів, і другу коли судно завершує оберт повертаючись від 90 градусів до 180 градусів. При повороті на вітер або проти хвилі, першу частину повороту виконують на малому ходу, а другу, коли вітер впливає на борт і допомагає повороту, на більших обертах двигуна."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":189,"sourceNumber":187,"text":"Які дії слід зробити при плаванні судна на мілині?","options":["на мілководді погіршується стійкість судна на курсі, з'являється втрата швидкості, через появу природної хвилі, спостерігається просідання судна. При плаванні судна по мілководдю необхідно заздалегідь зменшити його швидкість і бути уважним на кермі;","на мілководді покращується стійкість судна на курсі, з'являється втрата швидкості через появу природної хвилі, спостерігається просідання судна. При плаванні судна по мілководдю необхідно заздалегідь збільшити його швидкість і бути уважним на кермі;","на мілководді погіршується стійкість судна на курсі, з'являється набір швидкості через появу природної хвилі, спостерігається просідання судна. При плаванні судна по мілководдю необхідно заздалегідь зменшити його швидкість і віддати якір."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":190,"sourceNumber":188,"text":"У яких випадках дозволяється перетинання курсів і обгін суден?","options":["для прогулянкового/малого судна: у всіх випадках маневр на розходження або обгін має бути безпечним з урахуванням погодних умов, достатнього водного простору з урахуванням руху інших суден;","для прогулянкового/малого судна: у всіх випадках маневр на розходження або обгін має бути безпечним з урахуванням місцевих умов плавання, достатнього водного простору з урахуванням руху інших суден;","для прогулянкового/малого судна у випадках які дозволяються місцевими правилами судноплавства на внутрішніх водних шляхах маневр на розходження або обгін має бути безпечним з урахуванням гарної видимості, достатнього водного простору з урахуванням руху інших суден."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":191,"sourceNumber":189,"text":"Як повинні діяти судна, що йдуть курсами, які виключають усяку небезпеку зіткнення?","options":["для прогулянкового/малого судна: кожне із зазначених суден повинно зберегти свій курс і свою швидкість і не змінювати їх до кінця розходження;","для прогулянкового/малого судна: кожне із зазначених суден повинно зберегти свій курс але збільшити свою швидкість до 5 вузлів і не змінювати їх до кінця розходження;","для прогулянкового/малого судна: кожне із зазначених суден повинно зберегти свій курс і не змінювати його до кінця розходження."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":192,"sourceNumber":190,"text":"Як повинно діяти судно, якому при зустрічному плаванні чи при перетині курсів дають дорогу?","options":["прогулянкове/мале судно, якому повинні поступитися шляхом, має зберігати курс і збільшити швидкість, але коли для нього стає очевидним, що судно, яке має поступитися шляхом, не робить відповідної дії щодо безпечного розходження, зобов'язано вжити власні оптимальні дії, щоб уникнути зіткнення;","прогулянкове/мале судно, якому повинні поступитися шляхом, має зберігати курс і швидкість, але коли для нього стає очевидним, що судно, яке має поступитися шляхом, не робить відповідної дії щодо безпечного розходження, зобов'язано вжити власні оптимальні дії, щоб уникнути зіткнення;","прогулянкове/мале судно, якому повинні поступитися шляхом, має зберігати курс і зменшити швидкість, але коли для нього стає очевидним, що судно, яке має поступитися шляхом, не робить відповідної дії щодо безпечного розходження, зобов'язано вжити власні оптимальні дії, щоб уникнути зіткнення."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":193,"sourceNumber":191,"text":"Як повинні вчинити судна, які мають радіотелефонний зв'язок, при розходженні або обгоні?","options":["судна, обладнані радіотелефонного зв'язком, повинні до розходження і обгону своєчасно нагадати один одному про розходження правим бортом або обгону на каналі виділеному для радіообміну;","судна, обладнані радіотелефонного зв'язком, повинні до розходження і обгону своєчасно домовитися про найбільш зручне місце зустрічі і узгодити борт розходження або обгону на каналі виділеному для радіообміну;","судна, обладнані радіотелефонного зв'язком, повинні до розходження і обгону бути на зв'язку один з одним на каналі виділеному для радіообміну."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":194,"sourceNumber":192,"text":"Чи повинні зменшувати швидкість судна іншої категорії, коли їх обганяє прогулянкове/мале судно?","options":["всі судна які обгоняться повинні, при необхідності і можливості, полегшити обгін. Вони повинні зменшити швидкість, щоб обгін міг бути здійснений в умовах безпечної дистанції між бортами і досить швидко з тим, щоб уникнути тривалого перебування суден на траверзі, коли можуть виникнути сили тяжіння (присмоктування), коли судна йдуть назустріч один одному бортами;","всі судна які обгоняться повинні, при необхідності і можливості, полегшити обгін. Вони повинні збільшити швидкість, щоб обгін міг бути здійснений в умовах безпечної дистанції між бортами і досить швидко з тим, щоб уникнути тривалого перебування суден на траверзі, коли можуть виникнути сили тяжіння (присмоктування), коли судна йдуть назустріч один одному бортами;","всі судна які обгоняться повинні, при необхідності і можливості, полегшити обгін. Вони повинні зменшити відстань між бортами, щоб обгін міг бути здійснений в умовах безпечної дистанції між бортами і досить швидко з тим, щоб уникнути тривалого перебування суден на траверзі, коли можуть виникнути сили тяжіння (присмоктування), коли судна йдуть назустріч один одному бортами."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":195,"sourceNumber":193,"text":"Що відбувається з судном на мілководді?","options":["погіршується стійкість судна на курсі, з'являється рискливість, втрата швидкості через появи придонних хвиль, спостерігається просідання судна;","погіршується стійкість судна на курсі, з'являється набір швидкості через появи придонних хвиль;","погіршується стійкість судна на курсі, з'являється рискливість, спостерігається просідання судна, через появи придонних хвиль."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":196,"sourceNumber":194,"text":"У яких випадках швидкісні судна можуть рухатися у неводотоннажному положенні?","options":["тільки в денний час доби, при видимості не менше 1000 м, а також вони не повинні слідувати в кільватері інших суден;","тільки в денний час доби, при видимості не менше 500 м, а також вони не повинні слідувати в кільватері інших суден;","в нічний та в денний час доби, при видимості не менше 1000 м, а також вони не повинні слідувати в кільватері інших суден."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":197,"sourceNumber":195,"text":"Хто з двох прогулянкових/малих суден, курси яких перетинаються таким чином, що може виникнути небезпека зіткнення, повинен звільнити шлях?","options":["те судно, яке має інше на своїй правій стороні, повинно поступитися шляхом;","те судно, яке має інше на своїй лівій стороні, повинно поступитися шляхом;","те судно, яке йде до низу, повинно поступитися шляхом."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":198,"sourceNumber":196,"text":"Які дії повинні виконати судна, що йдуть вверх при зустрічному плаванні?","options":["при зустрічному зближенню судно, що йде вгору, зобов'язане поступитися шляхом судну, що йде вниз. Прогулянкове/мале судно при зустрічному зближенню повинне розходитися лівими бортами. Прогулянкове/мале судно, що йде вгору, має поступитися шляхом судну, що йде вниз, для чого судно, що йде вгору, має першим почати процедуру розходження. Для цього воно повинно не менше ніж за 200 м і в залежності від навігаційної обстановки подати сигнал прапором - сигналом з лівого борту. Після отримання відповіді - підтвердження прапором - сигналом з лівого борту від судна, що йде вниз, судно, що йде вгору, має відхилитися вправо і розходження зробити лівими бортами;","при зустрічному зближенню судно, що йде вгору, зобов'язане поступитися шляхом судну, що йде вниз. Прогулянкові/малі судна при зустрічному зближенню повинне розходитися правими бортами. Прогулянкове/мале судно, що йде вгору, має поступитися шляхом судну, що йде вниз, для чого судно, що йде вгору, має першим почати процедуру розходження. Для цього воно повинно не менше ніж за 300 м і в залежності від навігаційної обстановки подати сигнал прапором - сигналом з правого борту. Після отримання відповіді - підтвердження прапором - сигналом з правого борту від судна, що йде вниз, судно, що йде вгору, має відхилитися вліво і розходження зробити правими бортами;","при зустрічному зближенню судно, що йде вгору, зобов'язане поступитися шляхом судну, що йде вниз. Прогулянкові/малі судна при зустрічному зближенню повинне розходитися лівими бортами. Прогулянкове/мале судно, що йде вгору, має поступитися шляхом судну, що йде вниз, для чого судно, що йде вгору, має першим почати процедуру розходження. Для цього воно повинно не менше ніж за 300 м і в залежності від навігаційної обстановки подати сигнал прапором - сигналом з лівого борту. Після отримання відповіді - підтвердження прапором - сигналом з лівого борту від судна, що йде вниз, судно, що йде вгору, має відхилитися вправо і розходження зробити лівими бортами."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":199,"sourceNumber":197,"text":"Чи подають сигнал про розходження, судна, що йдуть вверх пропускаючи з лівого борту судна, що йдуть вниз?","options":["судно, що йде вгору, має поступитися шляхом судну, що йде вниз, для чого судно, що йде вгору, має першим почати процедуру розходження. При цьому воно не повинно подавати сигнали;","судно, що йде вгору, має поступитися шляхом судну, що йде вниз, для чого судно, що йде вгору, має першим почати процедуру розходження. Для цього воно повинно не менше ніж за 300 м і в залежності від навігаційної обстановки подати сигнал прапором - сигналом з лівого борту;","судно, що йде вгору, має поступитися шляхом судну, що йде вниз, для чого судно, що йде вгору, має першим почати процедуру розходження. При цьому воно повинно подавати сигнал прапором - сигналом з правого борту."],"correct":[1],"status":"source-key-conflict","note":"Для цього формулювання навчальні матеріали до банку питань дають варіант 2; загальне правило 6.4.2 окремо встановлює, що при пропуску з лівого борту сигнал не подається. У тесті використано ключ банку/підготовчих матеріалів.","needsImage":false,"scorable":true},{"id":200,"sourceNumber":198,"text":"Що таке обгін?","options":["наближення судна (що обганяє) до іншого судна (що обганяється) у напрямку під кутом більше 22,5 град. позаду по траверзі судна, що обганяється;","коли одне судно, наближається вночі до іншого судна в секторі його кормового вогню (135°), тобто вночі судно, що обганяє може бачити тільки кормовий вогонь поганяти судна і не може бачити жоден з його бортових вогнів;","рух суден паралельними курсами за умови перевищення швидкості одного з них."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":201,"sourceNumber":199,"text":"При яких умовах дозволяється обгін суден?","options":["для прогулянкового/малого судна обгін дозволяється тільки тоді, коли судно, що обганяє впевнено, що маневр по обгону відбудеться безпечно з урахуванням місцевих умов плавання і руху інших суден. Судно, що обганяє, незалежно від того моторне воно або вітрильне, має обходити судно, що обганяють зі швидкістю відповідної даних умов плавання, тримаючись на відстані не менше 30 м;","для прогулянкового/малого судна обгін дозволяється тільки тоді, коли судно, що обганяє впевнено, що маневр по обгону відбудеться безпечно з урахуванням місцевих умов плавання і руху інших суден. Судно, що обганяє, незалежно від того моторне воно або вітрильне, має обходити судно, що обганяють зі швидкістю відповідної даних умов плавання, тримаючись на відстані не менше 10 м;","для прогулянкового/малого судна обгін дозволяється тільки тоді, коли судно, що обганяє впевнено, що маневр по обгону відбудеться безпечно з урахуванням місцевих умов плавання і руху інших суден. Судно, що обганяє, незалежно від того моторне воно або вітрильне, має обходити судно, що обганяють зі швидкістю відповідної даних умов плавання, тримаючись на відстані не менше 20 м."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":202,"sourceNumber":200,"text":"Як повинно діяти судно, яке обганяють?","options":["судно, яке обганяють, повинне при необхідності і можливості полегшити обгін, збільшити швидкість, коли це необхідно, для того щоб обгін міг бути проведений в умовах безпечного плавання і досить швидко, з тим щоб не заважати іншим суднам;","судно, яке обганяють, повинне при необхідності і можливості полегшити обгін, зменшити швидкість, коли це необхідно, для того щоб обгін міг бути проведений в умовах безпечного плавання і досить швидко, з тим щоб не заважати іншим суднам;","судно, яке обганяють, повинне при необхідності і можливості полегшити обгін, змінити курс, коли це необхідно, для того щоб обгін міг бути проведений в умовах безпечного плавання і досить швидко, з тим щоб не заважати іншим суднам."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":203,"sourceNumber":201,"text":"Яким чином прогулянкове/мале судно здійснює обгін іншого подібного судна?","options":["судно, що обганяє, незалежно від того моторне воно або вітрильне, або веслове має обходити судно, що обганяють зі швидкістю відповідної до даних умов плавання, тримаючись на відстані не менше 10 метрів від його шляху наступним чином: при перетині фарватеру тільки по його правому борту, за межами фарватеру - з будь-якого борту;","судно, що обганяє, незалежно від того моторне воно або вітрильне, або веслове має обходити судно, що обганяють зі швидкістю відповідної до даних умов плавання, тримаючись на відстані не менше 10 метрів від його шляху наступним чином: при перетині фарватеру - з будь-якого борту, за межами фарватеру по його лівому борту;","судно, що обганяє, незалежно від того моторне воно або вітрильне, або веслове має обходити судно, що обганяють зі швидкістю відповідної до даних умов плавання, тримаючись на відстані не менше 10 метрів від його шляху наступним чином: при перетині фарватеру тільки по його лівому борту, за межами фарватеру - з будь-якого борту."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":204,"sourceNumber":202,"text":"Про що свідчить сигнал \"п'ять коротких звуків\" судна, яке обганяють?","options":["\"П'ять коротких звуків\" подає транспортне судно тоді, коли обгін його іншим судном неможливий через ризик зіткнення. Означає: \"Мене обганяти не можна\". Прогулянкові/малі судна цей сигнал під час обгону не застосовують. Звукові сигнали повинні супроводжуватися синхронно світловими сигналами, що мають жовтий колір і сектор освітлення 360 градусів, як вдень, так і вночі;","\"П'ять коротких звуків\" подає транспортне судно тоді, коли обгін його іншим судном можливий без ризику зіткнення. Означає: \"Мене обганяти можна\". Прогулянкові/малі судна цей сигнал під час обгону не застосовують. Звукові сигнали повинні супроводжуватися синхронно світловими сигналами, що мають жовтий колір і сектор освітлення 360 градусів, як вдень, так і вночі;","\"П'ять коротких звуків\" подає транспортне судно тоді, коли обгін його іншим судном неможливий через те що воно збирається здійснити маневр. Означає: \"Мене обганяти не можна\". Прогулянкові/малі судна цей сигнал під час обгону не застосовують. Звукові сигнали повинні супроводжуватися синхронно світловими сигналами, що мають жовтий колір і сектор освітлення 360 градусів, як вдень, так і вночі."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":205,"sourceNumber":203,"text":"Що повинно зробити прогулянкове/мале судно, якщо при здійсненні обгону воно створює високу хвилю?","options":["в такому випадку судно, що обганяє, має збільшити хід або збільшити дистанцію між бортами при обгоні, якщо дозволяє ширина безпечного водного простору, або те й інше разом з тим, щоб зменшити висоту хвилі від свого судна і зробити обгін безпечно;","в такому випадку судно, що обганяє, має зменшити хід або збільшити дистанцію між бортами при обгоні, якщо дозволяє ширина безпечного водного простору, або те й інше разом з тим, щоб зменшити висоту хвилі від свого судна і зробити обгін безпечно;","в такому випадку судно, що обганяє, має зупинитесь або збільшити дистанцію між бортами при обгоні, якщо дозволяє ширина безпечного водного простору, або те й інше разом з тим, щоб зменшити висоту хвилі від свого судна і зробити обгін безпечно."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":206,"sourceNumber":204,"text":"Які повинні бути умови до вибору місця якірної стоянки судна?","options":["обидві відповіді вірні;","місце якірної стоянки повинно бути: з гарною тримаючою силою ґрунту, з достатнім водним простором при зміні положення судна при зміні вітру (течії);","місце якірної стоянки повинно бути: захищене від вітру, має достатню глибину, з рівним плином."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":207,"sourceNumber":205,"text":"Дія вітру на судно залежить від?","options":["вплив вітру на судно залежить не тільки від сили вітру, але і від ряду інших факторів, які необхідно враховувати при управлінні судном. Серед цих чинників дуже важливо ставлення осадки до надводного борту. Іншим важливим фактором є курсовий кут відносно вітру;","вплив вітру на судно залежить не тільки від сили вітру. Дуже важливим фактором є розміщення надбудови судна;","вплив вітру на судно залежить не тільки від сили вітру. Дуже важливим фактором є осадки судна."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":208,"sourceNumber":206,"text":"Борт судна, звернений до вітру це?","options":["надвітренний борт;","лівий борт;","правий борт."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":209,"sourceNumber":207,"text":"Борт судна, протилежний вітру?","options":["правий борт;","підвітренний борт;","лівий борт."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":210,"sourceNumber":208,"text":"Як називається вітер за напрямом корми судна?","options":["фордевінд;","левентік;","зют вест."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":211,"sourceNumber":209,"text":"Що впливає на величину дрейфу судна?","options":["експлуатаційний стан судна (наявність крену, диферентна, величина висоти надводного борту, величина опади тощо), зовнішні чинники (сила вітру, течії, величина запасу води під кілем та ін.);","конструктивні характеристики судна (форма обводів корпусу, розташування і величина настройки, матеріал корпусу, тип рульового комплексу та ін.), експлуатаційний стан судна (наявність крену, диферентна, величина висоти надводного борту, величина опади тощо), зовнішні чинники (сила вітру, течії, величина запасу води під кілем та ін.);","конструктивні характеристики судна (форма обводів корпусу, розташування і величина настройки, матеріал корпусу, тип движительно-рульового комплексу та ін.), експлуатаційний стан судна (наявність крену, диферентна, величина висоти надводного борту, величина опади тощо."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":212,"sourceNumber":210,"text":"Найбільший знос судно зазнає:","options":["зношення судна викликається дією на судно сили вітру і течії. При вітрі найбільшому зносу підтверджено судно тоді, коли воно розташоване бортом проти вітру, має велику парусність, не великій надводний борт і велику осадку, має диферент, крен. При течії найбільшу знесенню схильне судно тоді, коли воно розташоване бортом до течії, має велику осадку, має диферент, крен;","зношення судна викликається дією на судно сили вітру і течії. При вітрі найбільшому зносу підтверджено судно тоді, коли воно розташоване носом до вітру, має не велику парусність, великий підводний борт і велику осадку, має диферент, крен. При течії найбільшу знесенню схильне судно тоді, коли воно розташоване бортом до течії, має велику осадку, має диферент, крен;","зношення судна викликається дією на судно сили вітру і течії. При вітрі найбільшому зносу підтверджено судно тоді, коли воно розташоване бортом до вітру, має велику парусність, високий надводний борт і малу осадку, має диферент, крен. При течії найбільшу знесенню схильне судно тоді, коли воно розташоване бортом до течії, має велику осадку, має диферент, крен."],"correct":[2],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":213,"sourceNumber":211,"text":"Під час руху судна на мілководді судноводію необхідно:","options":["заздалегідь зменшити його швидкість і бути уважним на кермі;","необхідно стати на якір і бути уважним на кермі;","необхідно зупинити судно і бути уважним на кермі."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":214,"sourceNumber":212,"text":"Виводити катер із суводі потрібно?","options":["в сторону стрижня, максимально збільшуючи швидкість. Вивести прогулянкове/мале судно з суводі легше, якщо його вести по зовнішньому краю суводі біля самого берега;","в сторону стрижня, максимально зменшуючи швидкість. Вивести прогулянкове/мале судно з суводі легше, якщо його вести по зовнішньому краю суводі біля самого берега;","в сторону від стрижня, максимально збільшуючи швидкість. Вивести прогулянкове/мале судно з суводі легше, якщо його вести по внутрішній частині суводі біля самого берега."],"correct":[0],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":215,"sourceNumber":213,"text":"На якій відстані, щоб запобігти присмоктуванню, необхідно проводити обгін на прогулянковому/малому судні великих суден?","options":["явище \"присмоктування\" при обгоні виникає на дистанції між бортами рівній менше половини довжині більшого судна;","явище \"присмоктування\" при обгоні виникає на дистанції між бортами рівній менше половини ширини більшого судна;","явище \"присмоктування\" при обгоні виникає на дистанції між бортами рівній менше половини ширини меншого судна."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":216,"sourceNumber":214,"text":"За скільки метрів можна починати обгін?","options":["для прогулянкового/малого судна за 200 м;","для прогулянкового/малого судна за 100 м;","для прогулянкового/малого судна за 150 м."],"correct":[1],"status":"verified","note":null,"needsImage":false,"scorable":true},{"id":217,"sourceNumber":215,"text":"Як повинні маневрувати прогулянкові/малі судна для розходження один з одним на акваторії, яка не має судноплавної обстановки?","options":["положення суден, вказане на малюнку, відповідає ситуації коли два судна йдуть назустріч один одному і має місце небезпечне зближення. Судна повинні розходитися лівими бортами. В даному випадку, коли відсутня судноплавна обстановка судноводій судна яке знаходиться справа на малюнку повинен вжити всіх заходів обережності, щоб розходження відбулось в місці і умовах, які забезпечили б безпечне розходження судна;","положення суден, вказане на малюнку, відповідає ситуації коли два судна йдуть назустріч один одному і має місце небезпечне зближення. Судна повинні розходитися правими бортами. В даному випадку, коли відсутня судноплавна обстановка, кожен з судноводіїв повине
